# Write /etc/easy/smoke-secrets.json on the core host and run the smoke suite once.
#
#   ./run.sh smoke-secrets.yml -e @/path/to/passwords.yml     # smoke_student_pw, smoke_teacher_pw
#
# The client secret is read on the IdP with kcadm (admin password from the env file, as
# doc/idp-setup.md §4 does) and carried to the core host in Ansible's memory under no_log; the two
# account passwords come from an extra-vars file on the controller that should not outlive the run.
# Nothing secret is printed — the IdP half reports the client's flags, its mappers and the users'
# roles, which is what to read when a login fails.
- hosts: idp
  become: true
  gather_facts: false
  tasks:
    - name: Ask the IdP about the smoke client and its users
      ansible.builtin.shell: |
        set -euo pipefail
        export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-* | head -1)
        export HOME=/root
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://127.0.0.1:8080/auth --realm master \
          --user "$(grep '^KC_BOOTSTRAP_ADMIN_USERNAME=' /etc/keycloak/keycloak.env | cut -d= -f2-)" \
          --password "$(grep '^KC_BOOTSTRAP_ADMIN_PASSWORD=' /etc/keycloak/keycloak.env | cut -d= -f2-)" >/dev/null 2>&1
        ID=$($K get clients -r master -q clientId=easy-smoke --fields id --format csv --noquotes | head -1)
        [ -n "$ID" ] || { echo "REPORT: client easy-smoke does not exist"; exit 3; }
        echo "REPORT: client flags: $($K get clients/$ID -r master --fields publicClient,standardFlowEnabled,directAccessGrantsEnabled,serviceAccountsEnabled --format csv --noquotes)"
        echo "REPORT: mappers: $($K get clients/$ID/protocol-mappers/models -r master --fields name,protocolMapper --format csv --noquotes | tr '\n' ' ')"
        SPA=$($K get clients -r master -q clientId=lahendus.ut.ee --fields id --format csv --noquotes | head -1)
        for who in student teacher; do
          UID_=$($K get users -r master -q username=easy-smoke-$who -q exact=true --fields id --format csv --noquotes | head -1)
          [ -n "$UID_" ] || { echo "REPORT: user easy-smoke-$who does not exist"; continue; }
          echo "REPORT: user easy-smoke-$who: $($K get users/$UID_ -r master --fields enabled,emailVerified,firstName,lastName --format csv --noquotes) email-set=$([ -n "$($K get users/$UID_ -r master --fields email --format csv --noquotes)" ] && echo yes || echo NO) spa-roles=$($K get users/$UID_/role-mappings/clients/$SPA -r master --fields name --format csv --noquotes | tr '\n' ',')"
        done
        echo "SECRET:$($K get clients/$ID/client-secret -r master --fields value --format csv --noquotes)"
      args:
        executable: /bin/bash
      register: idp
      changed_when: false
      no_log: true
      failed_when: idp.rc not in (0, 3)
    - name: What the IdP said (secret withheld)
      ansible.builtin.debug:
        msg: "{{ idp.stdout_lines | select('match', '^REPORT:') | list }}"
    - name: Keep the secret for the core host
      ansible.builtin.set_fact:
        easy_smoke_client_secret: "{{ (idp.stdout_lines | select('match', '^SECRET:') | first | default('SECRET:'))[7:] }}"
      no_log: true

- hosts: core
  become: true
  gather_facts: false
  vars:
    secret: "{{ hostvars[groups['idp'][0]]['easy_smoke_client_secret'] | default('') }}"
  tasks:
    - name: Refuse to write an empty secret
      ansible.builtin.assert:
        that: [secret | length > 0, smoke_student_pw | length > 0, smoke_teacher_pw | length > 0]
        fail_msg: the client secret or a password is missing; nothing written
        quiet: true
    - name: Write the smoke secrets file
      ansible.builtin.copy:
        dest: /etc/easy/smoke-secrets.json
        owner: root
        group: easy-rollout
        mode: "0640"
        content: "{{ {'client_id': 'easy-smoke', 'client_secret': secret,
                     'student': {'username': 'easy-smoke-student', 'password': smoke_student_pw},
                     'teacher': {'username': 'easy-smoke-teacher', 'password': smoke_teacher_pw}} | to_nice_json }}\n"
      no_log: true
    - name: Run the smoke suite against what is live
      ansible.builtin.command:
        cmd: sudo -u easy-rollout easy-smoke
      register: smoke
      changed_when: false
      failed_when: false
    - name: The suite's report
      ansible.builtin.debug:
        var: smoke.stdout_lines
