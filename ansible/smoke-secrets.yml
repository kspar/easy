# Write /etc/easy/smoke-secrets.json on the core host and run the smoke suite once.
#
#   ./run.sh smoke-secrets.yml
#
# Everything it needs is on the IdP host: the `easy-smoke` client's secret, read with kcadm (admin
# password from the env file, as doc/idp-setup.md §4 does), and the two account passwords from
# /etc/keycloak/smoke-users.txt, which smoke-idp-setup.yml wrote. All three cross to the core host in
# Ansible's memory under no_log and land in one 0640 root:easy-rollout file. Nothing secret is printed
# and nothing is typed. For accounts whose passwords were set by hand instead, pass them as
# `-e smoke_student_pw=... -e smoke_teacher_pw=...` (an extra-vars file, not the command line).
#
# The IdP half reports the client's flags, its mappers and the users' roles — what to read when a
# login fails — and the suite's report at the end is the proof the whole arrangement works.
- hosts: idp
  become: true
  gather_facts: false
  tasks:
    - name: Ask the IdP about the smoke client, its users, and their credentials
      ansible.builtin.shell: |
        set -uo pipefail
        export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-* | head -1)
        export HOME=/root
        K=/opt/keycloak/bin/kcadm.sh
        $K config credentials --server http://127.0.0.1:8080/auth --realm master \
          --user "$(grep '^KC_BOOTSTRAP_ADMIN_USERNAME=' /etc/keycloak/keycloak.env | cut -d= -f2-)" \
          --password "$(grep '^KC_BOOTSTRAP_ADMIN_PASSWORD=' /etc/keycloak/keycloak.env | cut -d= -f2-)" >/dev/null 2>&1 || { echo "REPORT: kcadm login failed"; exit 3; }
        ID=$($K get clients -r master -q clientId=easy-smoke --fields id --format csv --noquotes | head -1)
        [ -n "$ID" ] || { echo "REPORT: client easy-smoke does not exist — run smoke-idp-setup.yml"; exit 3; }
        echo "REPORT: client flags (public,standardFlow,directGrants): $($K get clients/$ID -r master --fields publicClient,standardFlowEnabled,directAccessGrantsEnabled --format csv --noquotes)"
        echo "REPORT: mappers: $($K get clients/$ID/protocol-mappers/models -r master --fields name --format csv --noquotes | tr '\n' ' ')"
        SPA=$($K get clients -r master -q clientId=lahendus.ut.ee --fields id --format csv --noquotes | head -1)
        for who in student teacher; do
          U=$($K get users -r master -q username=easy-smoke-$who -q exact=true --fields id --format csv --noquotes | head -1)
          [ -n "$U" ] || { echo "REPORT: user easy-smoke-$who does not exist — run smoke-idp-setup.yml"; continue; }
          echo "REPORT: easy-smoke-$who: enabled,verified=$($K get users/$U -r master --fields enabled,emailVerified --format csv --noquotes) email=$([ -n "$($K get users/$U -r master --fields email --format csv --noquotes)" ] && echo set || echo MISSING) roles=$($K get users/$U/role-mappings/clients/$SPA -r master --fields name --format csv --noquotes | tr '\n' ',')"
          pw=$(grep "^easy-smoke-$who:" /etc/keycloak/smoke-users.txt 2>/dev/null | head -1 | cut -d: -f2-)
          echo "PW_$who:$pw"
        done
        echo "SECRET:$($K get clients/$ID/client-secret -r master --fields value --format csv --noquotes)"
      args:
        executable: /bin/bash
      register: idp
      changed_when: false
      no_log: true
      failed_when: idp.rc not in (0, 3)
    - name: What the IdP said (credentials withheld)
      ansible.builtin.debug:
        msg: "{{ idp.stdout_lines | select('match', '^REPORT:') | list }}"
    - name: Keep the credentials for the core host
      ansible.builtin.set_fact:
        easy_smoke_client_secret: "{{ (idp.stdout_lines | select('match', '^SECRET:') | first | default('SECRET:'))[7:] }}"
        easy_smoke_student_pw: "{{ smoke_student_pw | default((idp.stdout_lines | select('match', '^PW_student:') | first | default('PW_student:'))[11:]) }}"
        easy_smoke_teacher_pw: "{{ smoke_teacher_pw | default((idp.stdout_lines | select('match', '^PW_teacher:') | first | default('PW_teacher:'))[11:]) }}"
      no_log: true

- hosts: core
  become: true
  gather_facts: false
  vars:
    idp_host: "{{ groups['idp'][0] }}"
    secret: "{{ hostvars[idp_host]['easy_smoke_client_secret'] | default('') }}"
    student_pw: "{{ hostvars[idp_host]['easy_smoke_student_pw'] | default('') }}"
    teacher_pw: "{{ hostvars[idp_host]['easy_smoke_teacher_pw'] | default('') }}"
  tasks:
    - name: Refuse to write anything incomplete
      ansible.builtin.assert:
        that: [secret | length > 0, student_pw | length > 0, teacher_pw | length > 0]
        fail_msg: >-
          the client secret or a password is missing — run smoke-idp-setup.yml on the IdP first, or pass
          smoke_student_pw / smoke_teacher_pw for accounts whose passwords were set by hand. Nothing written.
        quiet: true
    - name: Write the smoke secrets file
      ansible.builtin.copy:
        dest: /etc/easy/smoke-secrets.json
        owner: root
        group: easy-rollout
        mode: "0640"
        content: "{{ {'client_id': 'easy-smoke', 'client_secret': secret,
                     'student': {'username': 'easy-smoke-student', 'password': student_pw},
                     'teacher': {'username': 'easy-smoke-teacher', 'password': teacher_pw}} | to_nice_json }}\n"
      no_log: true
    - name: Run the smoke suite against what is live
      ansible.builtin.command:
        cmd: sudo -u easy-rollout easy-smoke
      register: smoke
      changed_when: false
      failed_when: false
    - name: The suite's report
      ansible.builtin.debug:
        var: smoke.stdout_lines
