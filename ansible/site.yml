---
# Every host in whichever inventory was named on the command line. Only hardening exists so far; the
# rest of what doc/staging-environment.md §9 asks for — Apache vhosts, postgres, Docker, the two
# systemd units, mailpit, the backup cron — becomes further roles.
#
# `hosts: all` rather than `hosts: staging` because the inventory is the environment boundary: there
# is no default inventory and no inventory contains two environments, so "all" can only ever mean the
# one that was named. See ansible.cfg.
#
# When those service roles arrive they will want plays per group (core, idp, executor) instead, since
# production separates onto three hosts what staging keeps on one. Hardening is the case that really
# does apply to every host, so it stays here — and add `serial: 1` before this targets more than one
# host at a time, so an sshd mistake locks out one box rather than all of them at once.
- name: Baseline hardening
  hosts: all
  become: true
  roles:
    - hardening
