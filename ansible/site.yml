---
# Every host in whichever inventory was named on the command line. What doc/dev-environment.md §9
# asks for is nearly all here now — nginx vhosts, postgres and its nightly dump, Docker, the two
# systemd units. Mailpit is the one still outstanding.
#
# Seeding the database is deliberately NOT part of this: `import-prod-dump.yml` replaces the whole
# database and dev is imported once and then drifts, so it is a thing you run knowingly rather than
# something a convergence run can decide to do to you.
#
# `hosts: all` rather than `hosts: dev` because the inventory is the environment boundary: there
# is no default inventory and no inventory contains two environments, so "all" can only ever mean the
# one that was named. See ansible.cfg.
#
# The service roles below target groups (core, idp, executor) for that reason: production separates
# onto three hosts what dev keeps on one. Hardening is the case that really does apply to every
# host, so it stays here, one host at a time.
- name: Baseline hardening
  hosts: all
  become: true
  # One host at a time, and this is the reason the whole play exists in this shape: an sshd change
  # that locks the connecting account out should do it to one box, leaving the other two reachable
  # to fix it from. Dev has one host in this play and pays nothing for the flag; production has
  # three and would otherwise lose all of them in parallel.
  serial: 1
  roles:
    - hardening

# Service roles target groups, not hosts, because dev keeps core, the IdP and the executor on one
# VM while production splits them across three. `core` has one member in dev and will have one in
# production; what changes is which other groups that same host is also in.
- name: Core
  hosts: core
  become: true
  roles:
    # core_config first: it is what creates the secrets file, and the postgres role reads the
    # password out of it on the host to set the database role's password to match.
    - core_config
    - postgres
    - core_service
    # After core_service: the release tree, the deploy group and the unit it restarts all come
    # from there. Pull-based, so nothing in GitHub holds a credential for this host — see the role.
    - core_autodeploy
    - nginx
    # Last, and after postgres: it registers itself in core's database, so the database has to
    # exist and be migrated first. Grading is also the one thing here that runs other people's
    # code, which is a good reason for it to be the last thing added to a host rather than the
    # first. See doc/dev-environment.md §6.
    - executor
    # After `executor`, and not interchangeable with it. This role uses that one's variables — which
    # images exist, where they live, where the executor listens — rather than declaring a second copy
    # of them, and role defaults only stay in scope for roles that come afterwards. It also registers
    # the database rows, which it can only do once it knows which images the host actually has.
    #
    # In production the executor is its own host, which is why this is a separate role rather than
    # more tasks in `executor`: it has to be installable there on its own.
    - executor_images

# For an environment where the executor is its own machine. Dev is not one — its host is in `core`
# and not in `executor`, so the two roles below run there from the play above and this play matches
# nothing.
#
# The duplication is deliberate, and the alternative is worse: moving dev's host into an `executor`
# group would mean editing a gitignored `hosts.yml` that every checkout has its own copy of, so a
# machine that had not made the same edit would quietly stop applying these two roles and report
# success. No host is in both groups, so nothing runs twice; if one ever is, both roles are
# idempotent.
#
# `executor` before `executor_images`, and not interchangeable — see the note in the Core play.
- name: Executor, where it is a host of its own
  hosts: executor
  become: true
  roles:
    - executor
    - executor_images

# The IdP is already its own host in dev, which is how production is laid out too — so unlike the
# core roles, nothing here has ever been able to assume co-location. The role brings its own postgres
# and its own nginx for exactly that reason.
- name: IdP
  hosts: idp
  become: true
  roles:
    - keycloak
