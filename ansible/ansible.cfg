[defaults]
# NO DEFAULT INVENTORY, on purpose.
#
# Each environment is its own directory under inventories/, and `-i` is mandatory. The alternative —
# one inventory holding dev and production, kept apart by remembering `--limit` — puts prod's sshd
# one forgotten flag away from being rewritten. Making the environment impossible to omit is worth
# more than any guard inside the play, because it fails at the command line instead of on the host.
#
# `ansible-playbook site.yml` with no -i therefore matches no hosts and does nothing, which is the
# intended outcome. `./run.sh` defaults to dev and refuses production.
roles_path = roles
# `-i inventories/dev` reads *every* file in that directory, so the committed
# `hosts.example.yml` next to the real one gets parsed too and its placeholder turns up as a host
# named `your-ssh-config-alias`, failing UNREACHABLE on every run. Keeping the template beside the
# thing it is a template for is worth more than working around that by moving it somewhere less
# obvious.
inventory_ignore_patterns = .*\.example\.ya?ml$
# YAML-shaped task results, which is what makes --diff output readable.
#
# NOT `stdout_callback = yaml`: that name resolves to community.general.yaml, which was removed in
# that collection's v12 and takes the whole run down at callback-load time with a message about a
# plugin nobody knowingly asked for. This pair is its built-in replacement, in ansible-core since
# 2.13. The ini key is `callback_result_format`, not the `result_format` the docs call the option.
stdout_callback = default
callback_result_format = yaml
# The hosts are in ~/.ssh/config; Ansible shells out to ssh and picks that up.
host_key_checking = True
interpreter_python = auto_silent
# Every task says what it changed, which matters more than speed on a box we log into rarely.
display_skipped_hosts = False
forks = 5
# Ten seconds — the default — is tight for a link to a VM in another country, and the penalty for
# exceeding it is out of all proportion: a task that waits too long for sudo's password prompt is
# reported UNREACHABLE, which aborts the play, and an aborted play never flushes its handlers. So a
# one-second network hiccup in the middle of a converge leaves services running the config they had
# before, having reported a failure that names neither the service nor the real cause.
#
# Seen on 2026-08-22: a full converge died at nginx's "Make sure nginx is running" with
# "Timeout (12s) waiting for privilege escalation prompt". The identical command re-run minutes
# later completed all 139 tasks, and the nginx role passes on its own — so nothing was wrong with
# the play. Ruled out along the way: sudo's prompt is emitted immediately even with a cold
# timestamp and no tty, so `use_pty` in the host's sudoers is not the cause.
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# The other half, and the one that actually contains the blast radius. The become-prompt timeout
# above raises AnsibleConnectionFailure, which is what the ssh plugin's retry decorator catches —
# so with retries the same blip costs a few seconds instead of the rest of the run.
#
# **The ini key is `retries`, not `reconnection_retries`.** The option is named the latter
# everywhere in the docs and in `ansible-doc -t connection ssh`, but the ini key it reads is
# `retries` under this section — spell it the documented way and it is silently ignored, leaving a
# setting that looks present and does nothing. Verify with `ansible-config dump --only-changed`,
# which lists what was actually read rather than what was written.
retries = 3
