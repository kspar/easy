# Copy to hosts.yml and fill in. `hosts.yml` is gitignored in every inventory: this repo is public,
# and which accounts can log in to a named internet-facing host is the one fact here worth keeping off
# the internet. Everything else — the sshd directives, the firewall rules, the fail2ban thresholds —
# is standard practice that loses nothing by being readable, so it lives in the role.
#
# Dev's deviations from the role's strict defaults are in `group_vars/all.yml`, not here.
#
# Hosts are named by their `~/.ssh/config` alias, so the address, user and key live in one place and
# `ssh <alias>` and `ansible-playbook` cannot drift apart. The flip side, hit on 2026-08-03: rename
# the alias and Ansible stops resolving the host, with an "unreachable" that reads like a network
# fault rather than a typo. `grep -i '^Host' ~/.ssh/config` is the check.
dev:
  hosts:
    your-ssh-config-alias:
      ansible_user: your-login

      # --- testing Moodle sync against a real course (temporary) -------------------------------
      # Uncomment all four together and re-run the core_config play.
      #
      # HOST vars, not the group `vars:` block below, and that is the whole reason they are up here
      # among the connection settings rather than with everything else. `group_vars/all/core.yml`
      # pins both Moodle URLs to a discard port, and Ansible ranks vars written in an inventory
      # *file* for a group BELOW `group_vars/*` — so putting these four down there loses silently:
      # the run succeeds, every assertion passes, and the host still talks to 127.0.0.1:9. Host vars
      # outrank group_vars. The role now asserts against this specific mistake, but the fix is here.
      #
      # They belong in this file rather than in group_vars for a second, unrelated reason: a real
      # Moodle hostname and a real course shortname are facts about a system that is not ours, and
      # group_vars is committed to a public repository. This file is not.
      #
      # Four, and not fewer. `moodle_allow_real` is what lets the URLs past the role's "must be
      # loopback" assertion; the allowlist is the condition attached to it, and the role refuses the
      # pair without it. Uncommenting the URLs alone fails the run, which is the intent.
      #
      # `easy_core_allow_real_outbound` stays false. It is a different, wider switch — it would also
      # unpin the Keycloak account-deletion cron and let mail out to real students — and nothing
      # about testing Moodle needs either. Do not reach for it when a Moodle assertion fails.
      #
      # The shortname must match Moodle's exactly: the check is a trimmed, case-sensitive comparison
      # against `course.moodle_short_name`, so a case difference reads as "not allowed" rather than
      # as a typo. Comma-separated if you genuinely need more than one, but one is the point. Note
      # that "," and " " parse to an empty set and mean UNRESTRICTED; the role refuses those.
      #
      # Also required, and not settable from here: the real `wstoken` in /srv/easy/conf/secrets.yaml
      # on the host, replacing `CHANGEME-no-moodle-token`. Ansible never writes that file. The role
      # refuses to continue while it is still the placeholder and Moodle is real — otherwise every
      # sync fails with a Moodle-side auth error that looks like a problem at their end.
      #
      # The two URLs are THE SAME, and deliberately so: this is Moodle's web-services REST endpoint,
      # and the `wsfunction` form field picks the operation. The role defaults those two function
      # names, so the URL is all you set. Do not go looking for two different paths — an older
      # version of this file suggested `/local/lahendus/get_course_users.php` and `import.php`,
      # which is the 2019 protocol, replaced on 2026-07-08 by EZ-1688/EZ-1615 (4c527f65) when core
      # started sending `wstoken`/`wsfunction`/`moodlewsrestformat`. Those plugin scripts never took
      # those parameters; the two spellings have never coexisted in a single commit.
      #
      # Put it back when you are done. This is not a state dev should sit in: with these set, any
      # tester submitting or grading anything on a linked course writes to that gradebook, and the
      # students sync rewrites the course roster and emails invitations to people who did not ask.
      #
      # easy_core_moodle_allow_real: true
      # easy_core_moodle_course_allowlist: "the-throwaway-course-shortname"
      # easy_core_moodle_users_url: https://moodle.example/webservice/rest/server.php
      # easy_core_moodle_grades_url: https://moodle.example/webservice/rest/server.php
  vars:
    # Everyone who may SSH in to this host. Each must already exist, with a key — the role asserts
    # both before it touches sshd, because on a host with no console a lockout is a rebuild.
    #
    # Include a second account that can actually get in. On a cloud image with no passwords set, a
    # second working key is the only insurance against an sshd change locking out the first; the
    # image's default account is the usual choice. See the notes on this variable in
    # roles/hardening/defaults/main.yml.
    hardening_ssh_users:
      - your-login
      - the-break-glass-account
