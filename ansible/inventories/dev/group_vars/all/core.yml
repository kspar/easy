---
# Core's configuration for dev — the non-secret half. Secrets are in `secrets.yml` beside this
# file, which is not in git.
#
# Most of this file is §5 of `doc/dev-environment.md` made executable: dev runs the same code
# as production, so it has the same outbound reach into real systems, and a separate database is only
# the easy half of keeping it harmless. The `core_config` role asserts these values rather than
# trusting them, because every item on that list is a value in this file being wrong.

# --- database, co-located on this VM ------------------------------------------------------------------
easy_core_db_host: 127.0.0.1

# The name matters more than it looks. Every script in `doc/core/anonymise-db/` refuses to run unless
# `current_database()` matches `(dev|stage|anon)`, because pointed at production they would rename
# every account and delete every invitation. A dev database called something else does not fail
# at setup — it fails during the phase 3 import, where the quickest way out is
# `-v ALLOW_ANY_DATABASE=true`, i.e. disarming the guard rather than satisfying it. The runbook in
# that directory uses this exact name.
easy_core_db_name: easyems_dev
easy_core_db_user: easyems

# --- URLs -------------------------------------------------------------------------------------------
easy_core_web_base_url: https://dev.lahendus.ut.ee

# Web and API are on separate origins here (dev.lahendus vs dev.ems.lahendus), so the web origin has
# to be allowed explicitly. Since EZ-1727 this is config rather than a hardcoded list, and the key is
# required — the context will not start without it. Worth knowing that the failure mode if this is
# wrong is a browser-side CORS error with nothing in the server log; core logs the list it parsed at
# startup, which is the thing to check.
easy_core_cors_allowed_origins: https://dev.lahendus.ut.ee

# --- identity ---------------------------------------------------------------------------------------
# Verified against a live IdP as of 2026-08-08, which is new: everything here used to be a guess
# because there was nothing to check it against. See doc/idp-setup.md for how the realm was built.
#
# This must be, character for character, the origin in the `issuer` of the tokens Keycloak mints —
# i.e. `https://` plus keycloak_hostname from inventories/dev/group_vars/idp.yml. The keycloak role
# asserts the two agree after every run, because a mismatch is a 401 on every login that looks
# nothing like a hostname problem.
#
# `dev.idp.lahendus.ut.ee` was a CNAME to `proxy.hpc.ut.ee` — a host that never served this IdP — so
# between 2026-08-08 and 2026-08-21 this said `easy-idp-dev.cloud.ut.ee`, the VM's own name. The alias
# now points at the VM, so the intended name is back. doc/idp-setup.md §5 has the history.
#
# ORIGIN ONLY, no path. The role asserts it. `/auth` is added by easy_core_idp_path_prefix for the
# Spring resource-server URIs; core's admin-API code appends its own. See core_config/defaults.
easy_core_idp_base_url: https://dev.idp.lahendus.ut.ee

# Keycloak's own admin realm, doubling as the application realm — which is not best practice and is
# kept anyway, because production does the same and dev is meant to be the release gate. One
# consequence worth knowing: in `master` the admin client is called `master-realm`, not the
# `realm-management` every Keycloak guide names. doc/idp-setup.md has the detail.
easy_core_keycloak_realm: master

# NOT the SPA's client (`lahendus.ut.ee`, public, PKCE), which is what browsers authenticate against.
# This is the confidential one core uses for admin-API work — the user lookup and deletion in
# delete_inactive_users.kt — and nothing else. Its secret lives in secrets.yaml on the core host.
#
# Its service account deliberately holds `view-users` and NOT `manage-users`, so even if the deletion
# cron below were unpinned, Keycloak would refuse the delete. That is §5's second line of defence and
# the one that survives someone changing the cron without reading why it was pinned.
easy_core_keycloak_client_id: easy-core

# --- the outbound safety catch, left ON -------------------------------------------------------------
# Deliberately not overridden here. Dev must not reach real systems, so the role's refusal to
# write a config that could stays in force. The three settings below are what it checks.
# easy_core_allow_real_outbound: false   <- inherited from the role, on purpose

# Port 9 is discard, and it is on loopback, so a request goes nowhere at all. A hostname that merely
# looks like dev would not do: the "sync grades" endpoint is reachable by hand, so a tester
# clicking it must not reach a gradebook that exists.
easy_core_moodle_users_url: http://127.0.0.1:9/moodle-disabled-on-dev
easy_core_moodle_grades_url: http://127.0.0.1:9/moodle-disabled-on-dev
# The Moodle token is not here: it is a real credential in an environment with a real Moodle, so it
# lives in the host's secrets file with the others rather than moving between the two depending on
# which environment is being configured. On dev it stays a placeholder, which is harmless — the
# URLs above go to a discard port, so there is nothing for a token to authenticate against.

# --- bug reports: stored and mailed, not filed ------------------------------------------------------
# Left off, and this is the one place where dev *not* reaching a real external system is about noise
# rather than about safety. The tracker is ours and an issue is harmless, but dev exists to be poked
# at — every button pressed twice, every form submitted with nonsense — and routing that into EZ would
# bury real reports under test ones. There is also no way to tell them apart afterwards: the issue
# says who filed it, not which environment they were on.
#
# So dev exercises everything up to the HTTP call: the dialog, the endpoint, the row, the DISABLED
# state, the admin mail.
#
# Reconsidered once EZ gained a dedicated `User-submitted issue` type (EZ-1786), which does weaken
# this: dev's noise would at least arrive pre-labelled and filterable. Still off, because filterable
# noise is noise somebody has to filter, and a filed issue records who reported it and not which
# environment they were on — so a dev report and a real one are indistinguishable once the type is
# shared. Turn it on temporarily to smoke-test a token, then turn it off again.
#
# easy_core_youtrack_enabled: false   <- inherited from the role, on purpose

# --- file storage: dev's own S3 bucket ---------------------------------------------------------------
# Opted in explicitly, and separately from the outbound catch above, which stays off. An object store
# is a real external system but not one that can hurt anybody outside this project: the bucket is
# ours, holds nothing but uploaded images, and is disposable.
#
# The one thing that would make it dangerous is sharing it with production, because the nightly sweep
# deletes objects that have no row in *this* host's database — and dev's database is an anonymised
# copy, so anything uploaded to production after the last import has no row here. Hence a bucket of
# dev's own, and the guard in the role that refuses production's name.
easy_core_storage_allow_s3: true
easy_core_storage_backend: s3
easy_core_storage_s3_bucket: lahendus-dev-files
easy_core_storage_s3_region: eu-north-1
easy_core_storage_s3_public_base_url: https://lahendus-dev-files.s3.eu-north-1.amazonaws.com

# The sweep reports and deletes nothing until this is flipped. Left off for now on purpose: with no
# reference columns on stored_file, a content column missing from its scan list means permanently
# deleting a file that is in use, and a night or two of "would delete ..." in the journal is how you
# find that out cheaply. Flip it once the logs look right.
easy_core_stored_file_sweep_delete: false

# The access key is NOT here. It lives in /srv/easy/conf/secrets.yaml on the host under
# easy.core.storage.s3.{access-key,secret-key}, with the database password and the Keycloak client
# secret — this file is in a public repository, and the role's credential grep fails the run if a
# secret ever appears in the managed config instead.

# --- mail: off until there is a catch-all ------------------------------------------------------------
# §5 wants mailpit here so mail stays testable but cannot escape. Until that role exists, off is the
# honest setting: pointing core at a local SMTP port with nothing behind it would mean every send
# fails at runtime, which reads as an application bug. Flip both to true, host 127.0.0.1 port 1025,
# when mailpit lands.
easy_core_mail_user_enabled: false
easy_core_mail_sys_enabled: false
easy_core_mail_from: noreply@dev.lahendus.ut.ee
easy_core_mail_sys_to: root@localhost

# --- who may deploy -----------------------------------------------------------------------------------
# SSH access is the real deploy permission (§10.5 is still an open question), so this list should track
# whoever is in hardening_ssh_users and actually deploys — not everyone who can log in. The grant is a
# single command: restart core, nothing else.
easy_core_deploy_users:
  - kspar

# --- the proxy ------------------------------------------------------------------------------------
# Both names already resolve to this VM, and the Let's Encrypt certificate the old dev host has been
# renewing carries both as SANs — which is most of why the planned `dev.core` rename was dropped.
easy_nginx_web_host: dev.lahendus.ut.ee
easy_nginx_api_host: dev.ems.lahendus.ut.ee

# Where Let's Encrypt sends expiry warnings. Worth being a real address: it is the backstop for a
# renewal timer nobody is watching.
easy_nginx_acme_email: kaspar.papli@helmes.com

# Let `grading-check.yml` create the exercise it submits to, and find it again by title on later
# runs. This said `grading_check_exercise: 9001` until the production import, which is a testdata id
# that the restore removed — and naming an imported exercise instead would have been worse than
# useless, because the check rewrites its target's grading script and makes it anonymously
# submittable.
#
# Deliberately absent for production, along with the id it replaces: that playbook submits work and
# runs a container, which is not something to do to a real environment casually.
grading_check_fixture: true

# --- automatic deploys ------------------------------------------------------------------------------
# Dev's, and stated here rather than assumed by the role. These used to be role defaults describing
# dev, which meant every other environment inherited dev's answers by saying nothing — production
# ended up with dev's deploy script and dev's config.json installed on it, harmless only because the
# timer was switched off by hand. Both roles are opt-in now and assert the branch.
#
# Since 2026-09-03 dev runs `core_rollout` — the guarded deployer written for production — rather
# than `core_autodeploy`, so that every push to dev-releases exercises the machinery production
# depends on: the dump, the rehearsal against a copy of the database, the end-to-end smoke suite,
# and the rollback. Off here, and the role removes the old timer on the next converge.
core_autodeploy_enabled: false

core_rollout_enabled: true
core_rollout_environment: dev
core_rollout_branch: dev-releases
core_rollout_config_src: "{{ playbook_dir }}/../deploy/dev/config.json"
core_rollout_health_url: https://dev.ems.lahendus.ut.ee/v2/
# Every thirty seconds: a push should be live within a few minutes, and most of those minutes are
# the dump and the rehearsal rather than the wait for a tick.
core_rollout_interval: "*:*:00,30"
# No window, no soak, no gap: dev IS the soak, and a promotion should land when it is green.
core_rollout_window: {always: true}
core_rollout_require_seen_on_dev: false
core_rollout_min_ci_age_hours: 0
core_rollout_min_gap_hours: 0
# A dump before every deploy and a rehearsal against it, as on production — this is where the
# rehearsal gets exercised before production trusts it.
core_rollout_rehearsal_enabled: true
# Dev's data is a disposable import; if the previous release will not come back after a rollback,
# a person looks rather than the machine restoring anything.
core_rollout_restore_db: never
# The smoke suite. The course and exercise are created once through the UI by the smoke teacher
# (doc/production-rollout.md §setup); until they exist the suite is not required here, so dev keeps
# deploying — with dump, rehearsal, health check and rollback, but without the end-to-end proof.
# Fill in the two ids and flip `required` to true as soon as they exist.
core_rollout_smoke_required: false
core_rollout_smoke_web_url: https://dev.lahendus.ut.ee
core_rollout_smoke_api_url: https://dev.ems.lahendus.ut.ee
core_rollout_smoke_idp_url: https://dev.idp.lahendus.ut.ee/auth
core_rollout_smoke_course_id: ""
core_rollout_smoke_exercise_id: ""
core_rollout_smoke_executor_version_url: http://127.0.0.1:5111/v1/version

# Publish what dev runs at /.well-known/easy-release, which production's rollout reads as evidence
# that a commit has been live here (its `require_seen_on_dev` gate).
easy_nginx_publish_release_sha: true
