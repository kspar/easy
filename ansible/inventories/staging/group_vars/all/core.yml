---
# Core's configuration for staging — the non-secret half. Secrets are in `secrets.yml` beside this
# file, which is not in git.
#
# Most of this file is §5 of `doc/staging-environment.md` made executable: staging runs the same code
# as production, so it has the same outbound reach into real systems, and a separate database is only
# the easy half of keeping it harmless. The `core_config` role asserts these values rather than
# trusting them, because every item on that list is a value in this file being wrong.

# --- database, co-located on this VM ------------------------------------------------------------------
easy_core_db_host: 127.0.0.1

# The name matters more than it looks. Every script in `doc/core/anonymise-db/` refuses to run unless
# `current_database()` matches `(staging|stage|anon)`, because pointed at production they would rename
# every account and delete every invitation. A staging database called something else does not fail
# at setup — it fails during the phase 3 import, where the quickest way out is
# `-v ALLOW_ANY_DATABASE=true`, i.e. disarming the guard rather than satisfying it. The runbook in
# that directory uses this exact name.
easy_core_db_name: easyems_staging
easy_core_db_user: easyems

# --- URLs -------------------------------------------------------------------------------------------
easy_core_web_base_url: https://dev.lahendus.ut.ee

# Web and API are on separate origins here (dev.lahendus vs dev.ems.lahendus), so the web origin has
# to be allowed explicitly. Since EZ-1727 this is config rather than a hardcoded list, and the key is
# required — the context will not start without it. Worth knowing that the failure mode if this is
# wrong is a browser-side CORS error with nothing in the server log; core logs the list it parsed at
# startup, which is the thing to check.
easy_core_cors_allowed_origins: https://dev.lahendus.ut.ee

# --- identity ---------------------------------------------------------------------------------------
# Verified against a live IdP as of 2026-08-08, which is new: everything here used to be a guess
# because there was nothing to check it against. See doc/idp-setup.md for how the realm was built.
#
# The hostname changed at the same time, and the old one was never right. `dev.idp.lahendus.ut.ee` is
# a CNAME to `proxy.hpc.ut.ee` — a host that has never served this IdP — so every config in this repo
# pointed at a name that could not have worked. The VM answers to `easy-idp-dev.cloud.ut.ee`, which is
# what Keycloak's `hostname` is set to and therefore what appears in the `issuer` of every token.
#
# ORIGIN ONLY, no path. The role asserts it. `/auth` is added by easy_core_idp_path_prefix for the
# Spring resource-server URIs; core's admin-API code appends its own. See core_config/defaults.
easy_core_idp_base_url: https://easy-idp-dev.cloud.ut.ee

# Keycloak's own admin realm, doubling as the application realm — which is not best practice and is
# kept anyway, because production does the same and staging is meant to be the release gate. One
# consequence worth knowing: in `master` the admin client is called `master-realm`, not the
# `realm-management` every Keycloak guide names. doc/idp-setup.md has the detail.
easy_core_keycloak_realm: master

# NOT the SPA's client (`lahendus.ut.ee`, public, PKCE), which is what browsers authenticate against.
# This is the confidential one core uses for admin-API work — the user lookup and deletion in
# delete_inactive_users.kt — and nothing else. Its secret lives in secrets.yaml on the core host.
#
# Its service account deliberately holds `view-users` and NOT `manage-users`, so even if the deletion
# cron below were unpinned, Keycloak would refuse the delete. That is §5's second line of defence and
# the one that survives someone changing the cron without reading why it was pinned.
easy_core_keycloak_client_id: easy-core

# --- the outbound safety catch, left ON -------------------------------------------------------------
# Deliberately not overridden here. Staging must not reach real systems, so the role's refusal to
# write a config that could stays in force. The three settings below are what it checks.
# easy_core_allow_real_outbound: false   <- inherited from the role, on purpose

# Port 9 is discard, and it is on loopback, so a request goes nowhere at all. A hostname that merely
# looks like staging would not do: the "sync grades" endpoint is reachable by hand, so a tester
# clicking it must not reach a gradebook that exists.
easy_core_moodle_users_url: http://127.0.0.1:9/moodle-disabled-on-staging
easy_core_moodle_grades_url: http://127.0.0.1:9/moodle-disabled-on-staging
# The Moodle token is not here: it is a real credential in an environment with a real Moodle, so it
# lives in the host's secrets file with the others rather than moving between the two depending on
# which environment is being configured. On staging it stays a placeholder, which is harmless — the
# URLs above go to a discard port, so there is nothing for a token to authenticate against.

# --- mail: off until there is a catch-all ------------------------------------------------------------
# §5 wants mailpit here so mail stays testable but cannot escape. Until that role exists, off is the
# honest setting: pointing core at a local SMTP port with nothing behind it would mean every send
# fails at runtime, which reads as an application bug. Flip both to true, host 127.0.0.1 port 1025,
# when mailpit lands.
easy_core_mail_user_enabled: false
easy_core_mail_sys_enabled: false
easy_core_mail_from: noreply@dev.lahendus.ut.ee
easy_core_mail_sys_to: root@localhost

# --- who may deploy -----------------------------------------------------------------------------------
# SSH access is the real deploy permission (§10.5 is still an open question), so this list should track
# whoever is in hardening_ssh_users and actually deploys — not everyone who can log in. The grant is a
# single command: restart core, nothing else.
easy_core_deploy_users:
  - kspar

# --- the proxy ------------------------------------------------------------------------------------
# Both names already resolve to this VM, and the Let's Encrypt certificate the old dev host has been
# renewing carries both as SANs — which is most of why the planned `dev.core` rename was dropped.
easy_nginx_web_host: dev.lahendus.ut.ee
easy_nginx_api_host: dev.ems.lahendus.ut.ee

# Where Let's Encrypt sends expiry warnings. Worth being a real address: it is the backstop for a
# renewal timer nobody is watching.
easy_nginx_acme_email: kaspar.papli@helmes.com
