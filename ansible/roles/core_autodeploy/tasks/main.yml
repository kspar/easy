---
# The account, the token, the script, and the timer that runs it.
#
# Depends on core_service having run: the release tree, the deploy group and the systemd unit this
# restarts all come from there, and this role only refers to them.
#
# **Opt-in, and the whole role is gated rather than just the timer.** It used to install everything
# unconditionally and let `core_autodeploy_enabled` decide only whether the timer was started. That
# left production carrying a deploy script pinned to dev's branch and one `systemctl start` away
# from installing a dev build — a stopped timer is not the same safety property as no timer. It also
# meant `enabled: true` was the default, so a new host tracked dev-releases unless someone
# remembered to say otherwise. Both halves of that are fixed here: nothing is installed unless the
# host asks for it, and a host that asks must name its own branch.

- name: Refuse to install autodeploy without saying which branch it tracks
  # No default for the branch, deliberately. A default is the mechanism by which a production host
  # quietly inherits `dev-releases`, and there is no value that is right for an unspecified host.
  ansible.builtin.assert:
    that:
      - core_autodeploy_branch is defined
      - core_autodeploy_branch | length > 0
      - core_autodeploy_config_src is defined
      - core_autodeploy_config_src | length > 0
    fail_msg: >-
      core_autodeploy_enabled is true, so this host must name both the branch it deploys from
      (core_autodeploy_branch) and the config.json that goes with it (core_autodeploy_config_src).
      Pushing to that branch is what deploys here and that file is what the deployed app reads for
      its backend and its realm — neither is something to inherit from a default.
    quiet: true
  when: core_autodeploy_enabled | bool

- name: Install it
  ansible.builtin.include_tasks: install.yml
  when: core_autodeploy_enabled | bool

- name: Remove it where it is not wanted
  ansible.builtin.include_tasks: absent.yml
  when: not core_autodeploy_enabled | bool
