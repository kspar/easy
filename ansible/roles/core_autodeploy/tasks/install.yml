---
# Included by main.yml only where core_autodeploy_enabled is true. See main.yml for why that gates
# the whole role and not merely the timer's state.

- name: Create the account the deploys run as
  ansible.builtin.user:
    name: "{{ core_autodeploy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/{{ core_autodeploy_user }}"
    create_home: true
    state: present

- name: Let it write the release tree
  # The group core_service made owner of /srv/easy. Appended, so this does not disturb whatever
  # else the account is in.
  ansible.builtin.user:
    name: "{{ core_autodeploy_user }}"
    groups: "{{ core_autodeploy_deploy_group }}"
    append: true
  when: not ansible_check_mode

- name: Let it restart core, and nothing else
  # Two exact commands, no wildcards — the same reasoning as core_service's grant for human
  # deployers. `systemctl` with a free argument is equivalent to root for anyone who can write a
  # unit file, and this account can write /srv/easy.
  ansible.builtin.copy:
    dest: /etc/sudoers.d/easy-autodeploy
    owner: root
    group: root
    mode: "0440"
    # A malformed sudoers file can lock everyone out of sudo entirely, so it is checked before it
    # is allowed to exist.
    validate: "visudo -cf %s"
    content: |
      # Managed by Ansible (roles/core_autodeploy) — local edits are overwritten.
      {{ core_autodeploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart {{ core_autodeploy_service }}

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ core_autodeploy_token_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- the token, which stays on the host --------------------------------------------------------
# Same arrangement as every other credential here: Ansible creates the file, never reads it, and
# afterwards only checks its shape. A placeholder is written so an unconfigured host says so rather
# than failing obscurely, and this role reports it on every run until a human replaces it.

- name: Create the token file if it does not exist
  ansible.builtin.copy:
    dest: "{{ core_autodeploy_token_file }}"
    owner: root
    group: "{{ core_autodeploy_user }}"
    mode: "0640"
    content: "CHANGEME-github-token-with-actions-read\n"
    force: false
  when: not ansible_check_mode

- name: Check the token file's shape, without reading its value
  ansible.builtin.stat:
    path: "{{ core_autodeploy_token_file }}"
  register: core_autodeploy_token_stat
  check_mode: false

- name: Refuse to leave the token world-readable
  ansible.builtin.assert:
    that:
      - core_autodeploy_token_stat.stat.mode == "0640"
      - core_autodeploy_token_stat.stat.pw_name == "root"
      - core_autodeploy_token_stat.stat.gr_name == core_autodeploy_user
    fail_msg: >-
      {{ core_autodeploy_token_file }} should be 0640 root:{{ core_autodeploy_user }} but is
      {{ core_autodeploy_token_stat.stat.mode | default('absent') }}
      {{ core_autodeploy_token_stat.stat.pw_name | default('') }}:{{ core_autodeploy_token_stat.stat.gr_name | default('') }}.
    quiet: true
  when:
    - not ansible_check_mode
    - core_autodeploy_token_stat.stat.exists

- name: Find out whether the token is still a placeholder
  # Greps rather than slurps: the answer is a yes/no, and reading the file to the controller to get
  # it would give away the property this whole arrangement exists to keep.
  ansible.builtin.command:
    cmd: grep -q '^CHANGEME' {{ core_autodeploy_token_file | quote }}
  register: core_autodeploy_token_placeholder
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say that deploys will not start until a token is in place
  ansible.builtin.debug:
    msg: >-
      {{ core_autodeploy_token_file }} still holds a placeholder, so the timer is installed and
      running but every tick will exit without deploying. Put a GitHub token with Actions:read for
      {{ core_autodeploy_repo }} in it — `sudo tee {{ core_autodeploy_token_file }}` — and no
      restart is needed; the next tick picks it up.
  when: core_autodeploy_token_placeholder.rc == 0

# --- this environment's config.json ---------------------------------------------------------------

- name: Place this environment's config.json
  # Out of the release tree on purpose: it belongs to the environment, so a rollback keeps today's
  # config rather than resurrecting the one that shipped with the older commit.
  ansible.builtin.copy:
    src: "{{ core_autodeploy_config_src }}"
    dest: "{{ core_autodeploy_config_json }}"
    owner: root
    group: "{{ core_autodeploy_deploy_group }}"
    mode: "0644"

# --- the deployer ------------------------------------------------------------------------------

- name: Install the deploy script
  ansible.builtin.template:
    src: easy-autodeploy.py.j2
    dest: /usr/local/bin/easy-autodeploy
    owner: root
    group: root
    mode: "0755"
    # Catches a template that renders to invalid Python before it is ever run by a timer, where the
    # failure would otherwise be a syntax error once a minute in the journal.
    validate: "python3 -m py_compile %s"

- name: Install the unit and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    validate: "systemd-analyze verify %s"
  loop:
    - easy-autodeploy.service
    - easy-autodeploy.timer
  notify: Reload the autodeploy timer

- name: Apply the unit before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable the timer
  # Unconditionally on: this file only runs where the flag is true, and the flag being false is
  # tasks/absent.yml's business now. It used to read `enabled: {{ core_autodeploy_enabled }}` here,
  # which is dead either way and, worse, reads as though switching the flag off were handled by this
  # line — the precise misconception the split exists to end. Disabling never was a state this task
  # could reach; it left the units installed and merely stopped.
  ansible.builtin.systemd_service:
    name: easy-autodeploy.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Say when it next runs
  ansible.builtin.command:
    cmd: systemctl list-timers easy-autodeploy.timer --no-pager
  register: core_autodeploy_next
  changed_when: false
  check_mode: false

- name: Show it
  ansible.builtin.debug:
    var: core_autodeploy_next.stdout_lines
