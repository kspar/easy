---
- name: Reload the autodeploy timer
  # daemon-reload alone re-reads the units but leaves the already-scheduled next tick in place, so
  # a changed interval would not take effect until something else restarted the timer.
  ansible.builtin.systemd_service:
    name: easy-autodeploy.timer
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - core_autodeploy_enabled | bool
