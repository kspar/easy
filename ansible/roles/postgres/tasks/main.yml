---
# Postgres for core: a cluster on loopback, a role, and an empty database. Core migrates it itself.
#
# The one genuinely interesting part is the password. It lives in the host's secrets file, which
# Ansible deliberately cannot read — so the task that tells postgres about it runs *on the host*,
# reads the file there, and reports only whether it had to change anything. That keeps the property
# core_config established: the credential exists in exactly one place, and that place is the server.

- name: Install postgres
  ansible.builtin.apt:
    name:
      - postgresql
      # community.postgresql talks to the server through this rather than shelling out to psql.
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

# Everything past this point needs a server that exists. In a dry run against a host without one the
# install above was only simulated, so the rest would fail on a service that is not there — which
# would abort the run and hide whatever the later tasks would have reported. Keying on the binary
# rather than on check mode means a dry run against an *installed* host still checks everything,
# which is the case that matters once dev is built.
- name: Find out whether postgres exists yet
  ansible.builtin.stat:
    path: /usr/lib/postgresql
  register: postgres_installed
  check_mode: false

- name: Say why the rest is being skipped
  ansible.builtin.debug:
    msg: >-
      postgres is not installed on this host and this is a dry run, so the cluster, role, database
      and login check below cannot be evaluated. Run without --check to install it, then dry-run
      again to see them.
  when: not postgres_installed.stat.exists

- name: Start postgres and keep it started
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: true
  when: postgres_installed.stat.exists

- name: Find out which cluster is running
  # The config path carries the major version (…/16/main/…), so it is discovered rather than assumed.
  # A release upgrade would otherwise silently leave this role editing the old cluster's config.
  community.postgresql.postgresql_query:
    db: postgres
    query: "SHOW config_file"
  become: true
  become_user: postgres
  register: postgres_config_file
  changed_when: false
  check_mode: false
  when: postgres_installed.stat.exists

- name: Keep postgres on loopback
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_file.query_result[0].config_file }}"
    regexp: '^\s*#?\s*listen_addresses\s*='
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
    validate: "grep -q '^listen_addresses' %s"
  notify: Restart postgres
  when: postgres_installed.stat.exists

- name: Apply the listen address before anything tries to connect
  ansible.builtin.meta: flush_handlers

# --- the role and the database ------------------------------------------------------------------------

- name: Create the role core connects as
  # `password` is deliberately not passed: this module would want the value, and the value is on the
  # host. The task below sets it there. Without a password the role simply cannot authenticate yet,
  # which is a safe intermediate state rather than an open one.
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEROLE
    state: present
  become: true
  become_user: postgres
  when: postgres_installed.stat.exists

- name: Create the database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: "{{ postgres_encoding }}"
    lc_collate: "{{ postgres_locale }}"
    lc_ctype: "{{ postgres_locale }}"
    # The cluster's default template carries the locale it was initialised with, so a database in a
    # different one has to come from template0.
    template: template0
    state: present
  become: true
  become_user: postgres
  when: postgres_installed.stat.exists

# --- the password, which only the host knows ------------------------------------------------------------

- name: Tell postgres the password the host already has
  # Runs entirely on the target: reads the secrets file, tries to authenticate with it over TCP, and
  # only issues an ALTER ROLE when that fails. So a converged host does nothing, the value never
  # reaches the controller or the logs, and re-running cannot break a working login.
  #
  # psycopg2's SQL composition quotes the literal, rather than string-formatting a password into a
  # statement — the value is generated here and happens to be URL-safe, but a hand-edited one need
  # not be, and a quote character would otherwise turn into a syntax error at best.
  ansible.builtin.command:
    cmd: python3 -
  args:
    stdin: |
      import subprocess, sys, yaml

      SECRETS = {{ postgres_secrets_path | to_json }}
      USER = {{ postgres_db_user | to_json }}
      DB = {{ postgres_db_name | to_json }}
      PORT = {{ postgres_port | to_json }}

      with open(SECRETS) as f:
          password = yaml.safe_load(f)["spring"]["datasource"]["password"]

      # Does it already work? If so there is nothing to do, and saying so is what makes this
      # idempotent rather than "ALTER ROLE every run and call it unchanged".
      probe = subprocess.run(
          ["psql", "-h", "127.0.0.1", "-p", str(PORT), "-U", USER, "-d", DB,
           "-tAc", "select 1"],
          env={"PGPASSWORD": password, "PATH": "/usr/bin:/bin"},
          capture_output=True, text=True,
      )
      if probe.returncode == 0 and probe.stdout.strip() == "1":
          print("already-correct")
          sys.exit(0)

      # Escaping, rather than string-formatting a password into a statement: standard_conforming_
      # strings has been on by default since 9.1, so doubling single quotes is the complete rule and
      # backslashes are literal. The generated value is URL-safe and needs none of this; a
      # hand-edited one might.
      literal = "'" + password.replace("'", "''") + "'"
      statement = 'ALTER ROLE "%s" WITH LOGIN PASSWORD %s;' % (USER, literal)

      # Fed on stdin, never as an argument — arguments are visible in `ps` to every user on the box
      # for as long as the command runs.
      alter = subprocess.run(
          ["runuser", "-u", "postgres", "--", "psql", "-v", "ON_ERROR_STOP=1", "-f", "-"],
          input=statement, capture_output=True, text=True,
      )
      if alter.returncode != 0:
          sys.exit("could not set the password: " + alter.stderr.strip())
      print("password-set")
  # Root, not postgres: the secrets file is 0640 root:easy-core, and widening that to the postgres
  # account would mean one more account able to read core's credentials. Root drops to postgres for
  # the one statement that needs the superuser, via runuser.
  become: true
  register: postgres_password_sync
  changed_when: "'password-set' in postgres_password_sync.stdout"
  # A dry run must not ALTER ROLE regardless of whether a server is there.
  when:
    - not ansible_check_mode
    - postgres_installed.stat.exists

# --- prove it actually works ----------------------------------------------------------------------------

- name: Connect the way core will
  # End to end over TCP with the real credential: role, password, pg_hba and the database all at
  # once. Creating a role and a database proves none of that — the first thing core does is exactly
  # this connection, and finding out here beats finding out from a stack trace at boot.
  ansible.builtin.command:
    cmd: python3 -
  args:
    stdin: |
      import subprocess, sys, yaml
      with open({{ postgres_secrets_path | to_json }}) as f:
          password = yaml.safe_load(f)["spring"]["datasource"]["password"]
      out = subprocess.run(
          ["psql", "-h", "127.0.0.1", "-p", str({{ postgres_port | to_json }}),
           "-U", {{ postgres_db_user | to_json }}, "-d", {{ postgres_db_name | to_json }},
           "-tAc", "select current_database() || ' as ' || current_user"],
          env={"PGPASSWORD": password, "PATH": "/usr/bin:/bin"},
          capture_output=True, text=True,
      )
      if out.returncode != 0:
          sys.exit("core's credentials do not work: " + out.stderr.strip())
      print(out.stdout.strip())
  # Root for the same reason as above: it has to read the secrets file. The connection it makes is an
  # ordinary password login over TCP, exactly like core's.
  become: true
  register: postgres_login_check
  changed_when: false
  when:
    - not ansible_check_mode
    - postgres_installed.stat.exists

- name: Say what connected
  ansible.builtin.debug:
    msg: "core will connect as: {{ postgres_login_check.stdout | default('(not checked in a dry run)') }}"

# --- the nightly dump -------------------------------------------------------------------------------

- name: Set up the nightly backup
  ansible.builtin.include_tasks: backup.yml
  when: postgres_installed.stat.exists

# --- the guard that only matters later --------------------------------------------------------------------

- name: Warn if the database name would block the anonymisation scripts
  # doc/core/anonymise-db/*.sql refuse to run unless current_database() matches (dev|stage|anon),
  # because pointed at production they would rename every account and delete every invitation. A
  # dev database named something else does not fail here — it fails in phase 3, at which point
  # the tempting fix is -v ALLOW_ANY_DATABASE=true, which is exactly the guard being disarmed.
  ansible.builtin.debug:
    msg: >-
      Database '{{ postgres_db_name }}' does not contain dev, stage or anon, so the
      anonymisation scripts in doc/core/anonymise-db/ will refuse to run against it. Rename it before
      the production import rather than passing ALLOW_ANY_DATABASE later.
  when: postgres_db_name is not search('(dev|stage|anon)')
