---
# The credentials, which stay on the server — the same property roles/core_config establishes, for
# the same reasons, and it is worth restating because it is the unusual part of this repo.
#
# Ansible writes Keycloak's configuration but never its credentials. The host needs them in plaintext
# regardless (Keycloak reads them at startup), so the only real choice was whether a *second* copy
# also lives on whatever laptop runs the playbook. It does not: this role creates the file if it is
# missing, generates the passwords on the host itself, and afterwards only ever checks the file's
# shape. Nothing to encrypt, nothing to gitignore, nothing to hand to a colleague.
#
# The cost, stated plainly: rebuilding this host from nothing needs these from somewhere else, and
# Ansible cannot rotate what it cannot read. **Back this file up.** It is four lines.

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ keycloak_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the directory password denylists live in
  # Outside the install, because an upgrade replaces the install and Keycloak refuses to start when a
  # realm's password policy names a denylist file that is not there. install.yml stamps whatever is
  # here into each version's data/password-blacklists.
  ansible.builtin.file:
    path: "{{ keycloak_blacklists_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the service group
  # Separately, and first: the user module will not create an account whose primary group does not
  # exist yet, and the env file below is group-readable by this group rather than by the account.
  ansible.builtin.group:
    name: "{{ keycloak_group }}"
    system: true
    state: present

- name: Create the service account
  # Created before the env file, which is group-readable by it. system:true — this account exists to
  # run one process, not to be logged into, and roles/hardening's AllowGroups means creating a Unix
  # account no longer implies SSH access anyway.
  ansible.builtin.user:
    name: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ keycloak_home }}"
    create_home: false
    state: present

- name: Make sure the env file has every credential Keycloak needs
  # Adds keys that are missing; never touches a value that is already there. Both halves matter — the
  # second because re-rolling the database password would leave Keycloak holding a credential postgres
  # no longer accepts, and re-rolling the admin password would silently do nothing at all (Keycloak
  # only reads it when bootstrapping an empty database) while looking like a rotation.
  #
  # The whole thing runs on the target, so the generated values never cross the network and never
  # reach the controller. That is the entire point of doing it here rather than in a variable.
  ansible.builtin.command:
    cmd: python3 - {{ keycloak_env_file | quote }} {{ keycloak_group | quote }}
  args:
    stdin: |
      import grp, os, pathlib, secrets, sys

      path, group = pathlib.Path(sys.argv[1]), sys.argv[2]
      HEADER = (
          "# Managed by Ansible (roles/keycloak), which adds missing keys and never reads or\n"
          "# changes existing values. This is the only copy of these credentials — back it up.\n"
          "#\n"
          "# systemd EnvironmentFile syntax: KEY=value, no quoting, no expansion. The generated\n"
          "# values are URL-safe base64, so none of that matters for them.\n"
      )
      # (key, how to fill it when absent)
      WANTED = [
          ("KC_DB_PASSWORD", lambda: secrets.token_urlsafe(33)),
          # Keycloak 26 spells the first-run admin this way. KEYCLOAK_ADMIN_* was the Keycloak 25
          # name for the same thing, and leaving that here would be silently ignored.
          ("KC_BOOTSTRAP_ADMIN_USERNAME", lambda: "admin"),
          ("KC_BOOTSTRAP_ADMIN_PASSWORD", lambda: secrets.token_urlsafe(24)),
      ]
      # Renamed by Keycloak 26, so a host that this role set up under 25 already holds the value
      # under the old name. Carry it across rather than generating a new one: the password in the
      # file is the one the *database* was bootstrapped with, and inventing a fresh one here would
      # write down a credential that has never opened anything.
      RENAMED = [
          ("KEYCLOAK_ADMIN", "KC_BOOTSTRAP_ADMIN_USERNAME"),
          ("KEYCLOAK_ADMIN_PASSWORD", "KC_BOOTSTRAP_ADMIN_PASSWORD"),
      ]

      existing = {}
      order = []
      if path.exists():
          for line in path.read_text().splitlines():
              if line.startswith("#") or "=" not in line:
                  continue
              k, _, v = line.partition("=")
              existing[k.strip()] = v
              order.append(k.strip())

      renamed = []
      for old, new in RENAMED:
          if old in existing and new not in existing:
              existing[new] = existing.pop(old)
              order[order.index(old)] = new
              renamed.append("%s->%s" % (old, new))

      added = []
      for key, make in WANTED:
          if key not in existing:
              existing[key] = make()
              order.append(key)
              added.append(key)

      if added or renamed:
          old = os.umask(0o027)
          try:
              path.write_text(HEADER + "".join("%s=%s\n" % (k, existing[k]) for k in order))
          finally:
              os.umask(old)
          said = []
          if renamed:
              said.append("renamed " + ",".join(renamed))
          if added:
              said.append("added " + ",".join(added))
          print("; ".join(said))
      os.chown(path, 0, grp.getgrnam(group).gr_gid)
      os.chmod(path, 0o640)
  become: true
  register: keycloak_secrets
  changed_when: keycloak_secrets.stdout is search('added|renamed')
  when: not ansible_check_mode

- name: Say which credentials were generated
  # Names only, never values. Worth reporting because a freshly generated admin password is the one
  # thing a human has to go and read off the host before they can log in for the first time.
  ansible.builtin.debug:
    msg: >-
      {{ keycloak_secrets.stdout }} in {{ keycloak_env_file }}. Read the admin password with
      `sudo grep KC_BOOTSTRAP_ADMIN_PASSWORD {{ keycloak_env_file }}` — it is the only copy.
  when: keycloak_secrets is changed

- name: Check the env file has the shape it should
  # A read of the file's *metadata*, deliberately not of its contents: the point of this arrangement
  # is that the controller never learns the values, and a task that slurped the file to validate it
  # would quietly give that property away.
  ansible.builtin.stat:
    path: "{{ keycloak_env_file }}"
  register: keycloak_env_stat
  check_mode: false

- name: Refuse to leave credentials world-readable
  ansible.builtin.assert:
    that:
      - keycloak_env_stat.stat.exists
      - keycloak_env_stat.stat.mode == "0640"
      - keycloak_env_stat.stat.pw_name == "root"
      - keycloak_env_stat.stat.gr_name == keycloak_group
    fail_msg: >-
      {{ keycloak_env_file }} should be 0640 root:{{ keycloak_group }} but is
      {{ keycloak_env_stat.stat.mode | default('absent') }}
      {{ keycloak_env_stat.stat.pw_name | default('') }}:{{ keycloak_env_stat.stat.gr_name | default('') }}.
      It holds the database and admin passwords.
    quiet: true
  when: not ansible_check_mode
