---
# Unpack the release, and install the theme.
#
# Versioned directory plus a stable symlink: an upgrade is "unpack the new one, move the link", and a
# rollback is moving it back. Everything else in this role refers to the link, never the version.

- name: Download the release
  # Checksummed, not trusted. `dest` is the versioned filename so a changed version downloads afresh
  # rather than silently reusing the previous archive under the same name.
  #
  # If this fails with a checksum mismatch, do not "fix" it by updating the hash: the whole point is
  # that the artifact matched the one whose provenance was verified. See defaults/main.yml.
  ansible.builtin.get_url:
    url: "{{ keycloak_zip_url }}"
    dest: "/var/cache/keycloak-{{ keycloak_version }}.zip"
    checksum: "sha256:{{ keycloak_zip_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: keycloak_zip

- name: Find out whether the archive is actually there
  # Guard on what exists, not on check mode — the same lesson roles/postgres, roles/nginx and
  # roles/core_service each needed. In a dry run against a host that has never had Keycloak, the
  # download above was only simulated, so unarchive would fail on a file that is not there and abort
  # the run before the unit, the vhost and the certificate were ever diffed. Keying on the file means
  # a dry run against an *installed* host still checks all of it, which is the case that matters
  # once this host exists.
  ansible.builtin.stat:
    path: "/var/cache/keycloak-{{ keycloak_version }}.zip"
  register: keycloak_zip_stat
  check_mode: false

- name: Say why the install is being skipped
  ansible.builtin.debug:
    msg: >-
      /var/cache/keycloak-{{ keycloak_version }}.zip is not on this host and this is a dry run, so
      unpacking it, the theme, the config, the unit and the build below cannot be evaluated. Run
      without --check to download it, then dry-run again to see the rest.
  when: not keycloak_zip_stat.stat.exists

- name: Note whether there is anything to configure
  # One gate for everything downstream — here, in service.yml and in the verification at the end of
  # main.yml. Both halves have to hold: a JVM to run it with, and an archive to unpack.
  ansible.builtin.set_fact:
    keycloak_ready_to_configure: >-
      {{ (keycloak_installed | default(false) | bool) and keycloak_zip_stat.stat.exists }}

- name: Unpack it
  # `creates:` rather than letting unarchive diff the tree every run: `kc.sh build` writes into
  # lib/quarkus, so an unpacked-and-built install no longer matches the archive and unarchive would
  # report changed on every single run and undo the build.
  ansible.builtin.unarchive:
    src: "/var/cache/keycloak-{{ keycloak_version }}.zip"
    dest: "{{ keycloak_install_parent }}"
    remote_src: true
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    creates: "{{ keycloak_versioned_home }}/bin/kc.sh"
  when: keycloak_ready_to_configure | bool

- name: Point the stable path at this version
  ansible.builtin.file:
    src: "{{ keycloak_versioned_home }}"
    dest: "{{ keycloak_home }}"
    state: link
  notify: Rebuild and restart keycloak
  when: keycloak_ready_to_configure | bool

- name: Let the service account own its own tree
  when: keycloak_ready_to_configure | bool
  # Keycloak's build step rewrites lib/quarkus and its runtime writes data/, so the account that runs
  # it needs to own both. The trade, stated because it is a real one: the service account can modify
  # the code it runs. The alternative — root-owned tree, build as root — means the build and the
  # runtime disagree about file ownership in data/, which Keycloak notices and complains about. This
  # is the arrangement the official container image uses, for the same reason.
  ansible.builtin.file:
    path: "{{ keycloak_versioned_home }}"
    state: directory
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    recurse: true

# --- password denylists ----------------------------------------------------------------------------
# Stamped into the install because Keycloak looks for them inside it, and kept outside the install
# because an upgrade replaces that directory. A realm policy naming a file that is not there stops
# the server from starting — after the schema has migrated — so this runs before the first build.

- name: Look for password denylists to carry into this install
  ansible.builtin.find:
    paths: "{{ keycloak_blacklists_dir }}"
    file_type: file
  register: keycloak_blacklists
  changed_when: false
  check_mode: false
  failed_when: false

- name: Make the directory Keycloak reads denylists from
  # A fresh distribution does not ship it — data/ is created by the build and the runtime — so the
  # copy below has nowhere to land until this exists.
  ansible.builtin.file:
    path: "{{ keycloak_versioned_home }}/data/password-blacklists"
    state: directory
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    mode: "0755"
  when:
    - keycloak_ready_to_configure | bool
    - (keycloak_blacklists.files | default([]) | length) > 0

- name: Stamp the denylists into the install
  # Keycloak reads exactly this path; there is no option pointing it elsewhere that is worth the
  # coupling. Copying is cheap and makes the install self-contained once built.
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ keycloak_versioned_home }}/data/password-blacklists/{{ item.path | basename }}"
    remote_src: true
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    mode: "0644"
  loop: "{{ keycloak_blacklists.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: keycloak_ready_to_configure | bool
  notify: Restart keycloak

- name: Say the realm asks for a denylist that is not here
  # The one failure this role can see coming and nothing else would: the policy lives in the realm
  # (data, not config), the file lives on disk, and they are checked against each other only at
  # startup — by which point Liquibase has already migrated the schema.
  ansible.builtin.debug:
    msg: >-
      {{ keycloak_blacklists_dir }} is empty. If this realm's password policy contains
      passwordBlacklist(<file>), Keycloak will migrate the database and then refuse to start. Put
      the file there and re-run before restarting.
  when:
    - keycloak_ready_to_configure | bool
    - (keycloak_blacklists.files | default([]) | length) == 0

# --- the theme -------------------------------------------------------------------------------------

- name: Look for the theme source
  ansible.builtin.stat:
    path: "{{ keycloak_theme_src }}/{{ keycloak_theme_name }}"
  register: keycloak_theme_stat
  check_mode: false
  when: keycloak_theme_install | bool

- name: Say the theme is not where it was expected
  # Not a failure: a Keycloak with the stock login page is a working Keycloak, and this theme arrived
  # with a home-directory restore rather than from a repository — so its absence on a rebuilt host is
  # entirely likely and should not stop the rest of the role.
  ansible.builtin.debug:
    msg: >-
      {{ keycloak_theme_src }}/{{ keycloak_theme_name }} does not exist, so the theme was not
      installed and the realm will use the stock Keycloak login page. That is functional. See
      doc/idp-setup.md for where the theme comes from.
  when:
    - keycloak_theme_install | bool
    - not keycloak_theme_stat.stat.exists

- name: Find out whether the theme is already installed
  ansible.builtin.stat:
    path: "{{ keycloak_versioned_home }}/themes/{{ keycloak_theme_name }}/login/theme.properties"
  register: keycloak_theme_installed
  check_mode: false
  when: keycloak_theme_install | bool

- name: Install the theme
  # Into themes/ as a plain directory rather than packaged into a jar in providers/. Directories are
  # what a theme under active repair wants: edit a template, restart, look. A jar would mean a build
  # step between every attempt, and this theme needed attempts — see the fixes below.
  #
  # Copied only when it is not already there. Nothing edits the copy any more, so this could be
  # unconditional — but "copy once" is what makes a hand-edit on the host survive a playbook run
  # while someone is debugging a template, and that is worth more than the tidiness.
  # To pick up a changed source: remove {{ keycloak_versioned_home }}/themes/{{ keycloak_theme_name }}
  # and run again. A version bump gets a new versioned home, so it copies afresh by itself.
  ansible.builtin.copy:
    src: "{{ keycloak_theme_src }}/{{ keycloak_theme_name }}/"
    dest: "{{ keycloak_versioned_home }}/themes/{{ keycloak_theme_name }}/"
    remote_src: true
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_group }}"
    mode: preserve
  when:
    - keycloak_ready_to_configure | bool
    - keycloak_theme_install | bool
    - keycloak_theme_stat.stat.exists | default(false)
    - not keycloak_theme_installed.stat.exists | default(false)
  notify: Restart keycloak

# --- the stylesheet fixes that used to live here ---------------------------------------------------
# Until Keycloak 26.7 this role rewrote two lines of the theme's login/theme.properties on the way in:
# the 2023 theme asked for PatternFly 4 paths (web_modules/...) that the Quarkus distributions do not
# ship, and for a css/tile.css that exists in no theme it inherits from. Upstream easy-kc-theme now
# tests against current Keycloak and ships the right paths, so patching them here would fight the
# source rather than repair it.
#
# If the login page comes up unstyled after a version bump, the fix belongs in
# github.com/kspar/easy-kc-theme — not back in this file. What the role still does not solve is that
# the theme is copied from a directory on the host rather than vendored; see doc/idp-setup.md.

- name: Say the theme still has to be selected
  # Installing a theme does not apply it. Keeping selection in the realm rather than in this role is
  # deliberate: if it renders badly on Keycloak 25, switching back to the stock theme should be two
  # clicks in the console, not a playbook run.
  ansible.builtin.debug:
    msg: >-
      Theme '{{ keycloak_theme_name }}' is installed but not selected. Set it per realm in
      Realm settings → Themes, or with the kcadm command in doc/idp-setup.md. It was built for
      Keycloak 15 — if the login page renders oddly, that is the first thing to suspect.
  when:
    - keycloak_theme_install | bool
    - keycloak_theme_stat.stat.exists | default(false)
