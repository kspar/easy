---
# Ubuntu 24.04 runs sshd under socket activation: ssh.socket listens, and every connection spawns
# its own sshd that reads the config fresh. Config changes are therefore live for the next
# connection whether or not anything is restarted — which is exactly why the validation in
# tasks/main.yml runs before the file is written, and why this handler is a formality rather than
# the thing that applies the change. Restarting the socket does not disturb established sessions.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded

# daemon_reload alone re-reads the unit but leaves the already-scheduled next run in place, so the
# new window would not take effect until something else restarted the timer — which on a stable host
# means the next reboot. Restarting it recalculates NEXT immediately, which is also what makes the
# change visible to `systemctl list-timers` while someone is still looking at it.
- name: Reload the apt timer
  ansible.builtin.systemd_service:
    name: apt-daily-upgrade.timer
    state: restarted
    daemon_reload: true

- name: Reload the reboot timer
  # Same reason as the apt timer: daemon-reload re-reads the unit but leaves the scheduled next run
  # in place, so a changed window would not take effect until something restarted it.
  ansible.builtin.systemd_service:
    name: easy-reboot-if-required.timer
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - hardening_unattended_reboot | bool

# journald re-reads its config and vacuums to the new cap on the next rotation; restarting makes that
# now rather than eventually. Logging is uninterrupted from the caller's point of view — the socket
# stays, so messages queue rather than being lost.
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
