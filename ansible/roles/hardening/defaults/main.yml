---
# These defaults are the STRICT ones, and deliberately not the ones staging runs.
#
# The role is meant for production as well as staging, so every value here is the answer for the
# host that matters most, and each environment loosens what it needs to in its own group_vars — with
# the reason next to the override. Written the other way round, staging's conveniences (a longer
# fail2ban leash, unattended reboots, agent forwarding) would become what a new prod host silently
# inherits, and nothing would announce it. Safe by omission; every relaxation deliberate and
# reviewable.
#
# `inventories/staging/group_vars/all.yml` is the worked example.

# Only members of this group may log in over SSH at all, so creating a user account is not the
# same thing as granting access.
hardening_ssh_group: ssh-users

# Everyone who may SSH in. Each must already exist as an account — the role asserts rather than
# creates, because silently inventing a login on a public host is not a thing a playbook should do.
#
# **Empty on purpose. Set it per host in the inventory**, which is not in this repo — see
# `inventory.example.yml` and the README. Which accounts can reach a named internet-facing host is
# the one part of this role worth not publishing; everything else here is standard practice that
# loses nothing by being readable.
#
# Empty is safe rather than dangerous: `AllowGroups` with an empty group would be a lockout, so the
# role asserts a non-empty list and asserts the connecting user is in it, both before it writes
# anything.
#
# Two rules for whatever list a host ends up with:
#
# - **Keep a second account that can get in.** On a cloud image with no passwords set, the console
#   is not a rescue path, so a second working key is the only insurance against an sshd change
#   locking out the first. The image's default account is the obvious candidate — keep it for that
#   reason rather than deleting it for tidiness.
# - **A listed account with no `authorized_keys` is not break-glass.** The role warns about this; it
#   is worth reading, because such an account can no longer log in at all once passwords are off.
hardening_ssh_users: []

# Whoever is running the playbook — the account whose key must survive the lockdown.
#
# Deliberately NOT the user_id fact: this play runs with `become: true`, so facts are gathered as
# root and that fact reads "root". The guard would then look for root's key, not find it, and fail
# with a message about the wrong account. ansible_user is a connection variable from the inventory
# — not a fact — and is the one that means what we want; SUDO_USER is the fallback if someone runs
# this without one set.
#
# Read out of ansible_facts rather than as top-level ansible_* variables: INJECT_FACTS_AS_VARS is
# deprecated and goes away in ansible-core 2.24, which would silently turn both fallbacks into
# undefined and leave the whole guard resolving to an empty string.
hardening_connecting_user: >-
  {{ ansible_user
     | default(ansible_facts.get('env', {}).get('SUDO_USER', ''), true)
     | default(ansible_facts.get('user_id', ''), true) }}

hardening_ssh_max_auth_tries: 3
hardening_ssh_login_grace_time: 20

# Source addresses allowed to reach port 22, as `any` or a list of CIDRs.
#
# The one value here that is NOT inverted to a strict default, because there is no strict value to
# guess: a wrong CIDR is a lockout, and a placeholder nobody notices is worse than an honest `any`.
# Authentication is key-only, so `any` is defensible on its own terms — brute force cannot succeed
# against it. Narrow it per environment where the set of source networks is actually known
# (e.g. ['193.40.0.0/16']).
hardening_ssh_allow_from: any

# Whether an authenticated session may forward ports. `no` by default: on a host where the database
# and the executor are on *other* machines, forwarding is not part of how anyone reaches them, so it
# is capability nobody needs. Environments that co-locate services on one box and reach them by
# tunnel should turn it on there, where that is true, rather than everywhere because it is true
# somewhere.
hardening_ssh_allow_tcp_forwarding: false

# Apache terminates TLS for both vhosts and certbot needs 80 reachable for ACME.
hardening_open_tcp_ports:
  - 80
  - 443

# fail2ban is noise reduction, not defence — key-only auth is the defence, and nothing fail2ban
# counts could have succeeded anyway. So these numbers trade log volume against the risk of banning
# someone who belongs, and the strict end of that trade is the conventional one.
#
# Be aware of how fast it counts before lowering it further: a single refused root login logs *two*
# failures, not one, so verifying a host's own config from one address burns through the allowance
# quicker than it looks.
hardening_fail2ban_bantime: 1h
hardening_fail2ban_findtime: 10m
hardening_fail2ban_maxretry: 5
hardening_fail2ban_ignoreip: []

# Whether the host may reboot itself to finish a security update, and when.
#
# `false` by default, because rebooting unattended is a decision about a *service*, not about a host:
# it drops in-flight work at an hour nobody is watching. An environment where that is cheap should
# say so itself. Note that leaving it off means someone has to notice `/var/run/reboot-required` and
# act, so "off" is only the safe answer if that actually happens — otherwise it is just an unpatched
# kernel with better manners.
hardening_unattended_reboot: false
hardening_unattended_reboot_time: "04:30"
