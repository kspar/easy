---
# TLS termination, the static web bundle, and a reverse proxy to core. That is the whole job.
#
# nginx rather than Apache, decided 2026-08-04. Apache was in the plan because mod_auth_openidc made
# it the security boundary; EZ-1724 moved JWT verification into core, so the proxy no longer
# authenticates anything and what remains is short in either. nginx is the simpler of the two to
# write and read. The trade accepted at the time: production runs Apache/2.4.52, so until this role
# reaches it the two environments differ in the component terminating TLS — which is a real gap in
# dev's value as a release gate, and the reason `/v2/unauth/versions` answers 200 on dev and 401 on
# production. Closing it is what doc/production-update.md §3 step 3 does.

# No defaults for the hostnames. They decide which certificate is requested and which origin the
# browser talks to, and a wrong guess here is a certificate request for a name someone else owns.
# easy_nginx_web_host — serves the SPA
# easy_nginx_api_host — serves core

easy_nginx_web_root: /srv/easy/web/current

# Serve the running commit id at /.well-known/easy-release. Off by default; dev turns it on because
# production's rollout reads it as proof that a commit has soaked there (roles/core_rollout, the
# `require_seen_on_dev` gate). The file is what both deployers write after a successful deploy.
easy_nginx_publish_release_sha: false
easy_nginx_release_sha_file: /srv/easy/current-sha
easy_nginx_api_upstream: "127.0.0.1:8080"

# --- TLS ------------------------------------------------------------------------------------------
# Let's Encrypt over HTTP-01. ACME is confirmed to work from inside UT's network (§10.1): the old dev
# host has been renewing a certificate whose SANs are exactly the two names used here.
easy_nginx_tls: true
easy_nginx_acme_webroot: /var/www/certbot
# easy_nginx_acme_email — no default; Let's Encrypt sends expiry warnings here, and those warnings are
# the backstop for a renewal timer nobody is watching.

# certbot writes one certificate covering both names, so there is one thing to renew and one thing to
# check. Named after the first host, which is how certbot names the directory under /etc/letsencrypt.
easy_nginx_cert_name: "{{ easy_nginx_web_host }}"
easy_nginx_cert_dir: "/etc/letsencrypt/live/{{ easy_nginx_cert_name }}"

# --- proxy behaviour --------------------------------------------------------------------------------
# Long enough for a slow auto-assessment to come back, short enough that a wedged request does not sit
# forever. Core's own timeouts should be the ones that decide, not the proxy's.
easy_nginx_proxy_read_timeout: 300s

# Submissions are text, but exercise assets are uploaded through core and the default 1m would reject
# them with a 413 that says nothing useful to the person uploading.
#
# This is the ceiling for everything EXCEPT POST /v2/files, which has its own below. Keeping it low
# here is the point: file upload is one endpoint, and raising the global limit to suit it would give
# every other endpoint the same allowance for nothing.
easy_nginx_max_body_size: 32m

# POST /v2/files only. Has to be at least easy_core_upload_max_bytes_admin, or nginx rejects an
# upload core would have accepted — and it does so with a 413 before core sees it, so the error the
# uploader gets is nginx's rather than the useful one about role limits.
easy_nginx_upload_max_body_size: 1g

# Uploading a gigabyte over a domestic connection takes minutes. With the ordinary 300s the failure
# is a 504 partway through a transfer that was progressing normally.
easy_nginx_upload_timeout: 900s
