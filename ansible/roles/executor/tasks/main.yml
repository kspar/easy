# The executor tier: Docker, and the aae service. doc/dev-environment.md §6.
#
# The grading images used to be here too — built on this host, from Dockerfiles copied onto it. They
# are `roles/executor_images`' business now: CI builds and verifies them once, publishes them under a
# tag it never overwrites, and the host pulls. That moved three problems off this role. A version
# bump no longer needs somebody with a shell; every host runs provably the same bytes rather than its
# own build of the same recipe; and rollback exists at all, which it did not while `docker build -t`
# moved a tag in place and left the previous image as untagged layers nobody would find in a hurry.
#
# `register_in_db.yml` stays here, because the executor row and the database name are this role's, and
# `ansible/import-prod-dump.yml` includes it by this role's name to put dev's executor back after a
# restore. `roles/executor_images` calls it once it knows which images the host actually has.
#
# Written to be re-runnable: every insert is conditional, so a second run reports almost nothing
# changed.

# Docker is its own task because an environment may already have it from somewhere this role should
# not fight. Production runs docker-ce 28.3.3 from Docker's own apt repository; installing
# `docker.io` there would make apt remove docker-ce to resolve the conflict, taking the container
# runtime down on the host whose entire job is running containers. Empty list, no opinion.
- name: Install Docker
  ansible.builtin.apt:
    name: "{{ executor_docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: executor_docker_packages | length > 0

- name: Install the tools the executor needs
  ansible.builtin.apt:
    name:
      # Ubuntu's own package rather than Docker's apt repository. One less third-party repo on a
      # host whose job is running other people's code, and the version difference does not matter
      # to `docker build` + `docker run`.
      - git
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make sure the Docker daemon is running and comes back after a reboot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

# --- the service account ------------------------------------------------------------------------

- name: Create the executor's group
  ansible.builtin.group:
    name: "{{ executor_group }}"
    system: true

- name: Create the executor's account
  ansible.builtin.user:
    name: "{{ executor_user }}"
    group: "{{ executor_group }}"
    # `docker` is what lets it grade at all. It is also, on any Linux host, equivalent to root —
    # written down here rather than discovered later, and the reason this account does nothing else.
    groups: docker
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ executor_root }}"
    create_home: false

# --- the code -------------------------------------------------------------------------------------

- name: Create the executor directory
  ansible.builtin.file:
    path: "{{ executor_root }}"
    state: directory
    owner: root
    group: "{{ executor_group }}"
    mode: "0750"

- name: Deploy the executor source
  ansible.builtin.copy:
    src: "{{ executor_src }}/{{ item }}"
    dest: "{{ executor_root }}/{{ item }}"
    owner: root
    group: "{{ executor_group }}"
    mode: "0640"
  loop:
    - server.py
    - containers.py
    - requirements.txt
  notify: Restart the executor

# server.py reports these on /v1/version, which core passes through to the About page (EZ-1709).
# A deployed executor has no git history to ask, so the commit is stamped here instead.
- name: Stamp the version and commit the executor is running
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ executor_stamp_dir }}/{{ item.name }}"
    owner: root
    group: "{{ executor_group }}"
    mode: "0644"
  loop:
    - name: VERSION
      content: "{{ lookup('file', playbook_dir + '/../VERSION') | trim }}"
    - name: COMMIT
      content: "{{ executor_commit | default(lookup('pipe', 'git -C ' + playbook_dir + '/.. rev-parse --short=7 HEAD'), true) }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the executor

# A venv is NOT immune to the system Python moving, which is easy to assume and wrong. `python3 -m
# venv` writes `version = 3.10.12` into pyvenv.cfg, puts packages in `lib/python3.10/site-packages`,
# and symlinks `bin/python3` at `/usr/bin/python3`. After a release upgrade that symlink resolves to
# 3.12, which does not read a 3.10 site-packages — so the venv is broken, and `pip` inside it is too,
# which means the task below cannot repair what it cannot run.
#
# Detecting the mismatch and starting over is the whole fix, and it makes a re-run of this role the
# recovery for a Python version change rather than something a human has to know to do by hand.
- name: Find out which Python the existing virtualenv was built for
  ansible.builtin.slurp:
    src: "{{ executor_venv }}/pyvenv.cfg"
  register: executor_pyvenv
  failed_when: false
  changed_when: false

- name: Discard a virtualenv built for a Python that is no longer here
  ansible.builtin.file:
    path: "{{ executor_venv }}"
    state: absent
  when:
    - executor_pyvenv.content is defined
    - (executor_pyvenv.content | b64decode | regex_search('version\\s*=\\s*([0-9]+\\.[0-9]+)', '\\1') | first | default('')) != ansible_python_version.split('.')[0:2] | join('.')

- name: Create the virtualenv and install the executor's dependencies
  ansible.builtin.pip:
    requirements: "{{ executor_root }}/requirements.txt"
    virtualenv: "{{ executor_venv }}"
    virtualenv_command: python3 -m venv
  notify: Restart the executor

- name: Install gunicorn into the virtualenv
  # Not in requirements.txt because that file describes what the application imports; gunicorn is
  # how this environment chooses to run it. start-executor.sh used the system gunicorn3 instead.
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ executor_venv }}"
  notify: Restart the executor

- name: Let the executor account read its virtualenv
  ansible.builtin.file:
    path: "{{ executor_venv }}"
    state: directory
    owner: root
    group: "{{ executor_group }}"
    recurse: true

- name: Write the gunicorn config
  ansible.builtin.template:
    src: gunicorn-conf.py.j2
    dest: "{{ executor_root }}/gunicorn-conf.py"
    owner: root
    group: "{{ executor_group }}"
    mode: "0640"
  notify: Restart the executor

# --- the service ----------------------------------------------------------------------------------
# Before the images, deliberately. Image builds are the slowest and most fragile thing here — they
# pull from Docker Hub and PyPI — and a failure in one of them used to abort the play before the
# unit was ever installed, leaving the host with no executor rather than one that could grade with
# the images that did build.

- name: Install the systemd unit
  ansible.builtin.template:
    src: easy-executor.service.j2
    dest: /etc/systemd/system/easy-executor.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the executor

- name: Start the executor and enable it at boot
  ansible.builtin.systemd_service:
    name: easy-executor
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers, so the check below tests what was just deployed
  ansible.builtin.meta: flush_handlers

- name: Ask the executor what it is
  ansible.builtin.uri:
    url: "http://{{ executor_bind_address }}:{{ executor_port }}/v1/version"
    return_content: true
  register: executor_version
  retries: 10
  delay: 2
  until: executor_version.status is defined and executor_version.status == 200
  # Asking is read-only, so a dry run should still ask — and has to, because the task below reads
  # this result. Skipped, it registers a dict with no `json` key and the debug fails on it, which is
  # what `--check` did against an otherwise healthy host.
  check_mode: false

- name: Say what answered
  ansible.builtin.debug:
    msg: "executor reports {{ executor_version.json }}"

