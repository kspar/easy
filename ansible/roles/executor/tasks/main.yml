# The executor tier: Docker, the aae service, the grading images, and the database rows that make
# core aware of all three. doc/dev-environment.md §6.
#
# Written to be re-runnable: images are built only when absent, and every insert is conditional, so
# a second run reports almost nothing changed.

- name: Install Docker and the tools the image builds need
  ansible.builtin.apt:
    name:
      # Ubuntu's own package rather than Docker's apt repository. One less third-party repo on a
      # host whose job is running other people's code, and the version difference does not matter
      # to `docker build` + `docker run`.
      - docker.io
      - git
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make sure the Docker daemon is running and comes back after a reboot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

# --- the service account ------------------------------------------------------------------------

- name: Create the executor's group
  ansible.builtin.group:
    name: "{{ executor_group }}"
    system: true

- name: Create the executor's account
  ansible.builtin.user:
    name: "{{ executor_user }}"
    group: "{{ executor_group }}"
    # `docker` is what lets it grade at all. It is also, on any Linux host, equivalent to root —
    # written down here rather than discovered later, and the reason this account does nothing else.
    groups: docker
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ executor_root }}"
    create_home: false

# --- the code -------------------------------------------------------------------------------------

- name: Create the executor directory
  ansible.builtin.file:
    path: "{{ executor_root }}"
    state: directory
    owner: root
    group: "{{ executor_group }}"
    mode: "0750"

- name: Deploy the executor source
  ansible.builtin.copy:
    src: "{{ executor_src }}/{{ item }}"
    dest: "{{ executor_root }}/{{ item }}"
    owner: root
    group: "{{ executor_group }}"
    mode: "0640"
  loop:
    - server.py
    - containers.py
    - requirements.txt
  notify: Restart the executor

# server.py reports these on /v1/version, which core passes through to the About page (EZ-1709).
# A deployed executor has no git history to ask, so the commit is stamped here instead.
- name: Stamp the version and commit the executor is running
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ executor_stamp_dir }}/{{ item.name }}"
    owner: root
    group: "{{ executor_group }}"
    mode: "0644"
  loop:
    - name: VERSION
      content: "{{ lookup('file', playbook_dir + '/../VERSION') | trim }}"
    - name: COMMIT
      content: "{{ executor_commit | default(lookup('pipe', 'git -C ' + playbook_dir + '/.. rev-parse --short=7 HEAD'), true) }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the executor

- name: Create the virtualenv and install the executor's dependencies
  ansible.builtin.pip:
    requirements: "{{ executor_root }}/requirements.txt"
    virtualenv: "{{ executor_venv }}"
    virtualenv_command: python3 -m venv
  notify: Restart the executor

- name: Install gunicorn into the virtualenv
  # Not in requirements.txt because that file describes what the application imports; gunicorn is
  # how this environment chooses to run it. start-executor.sh used the system gunicorn3 instead.
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ executor_venv }}"
  notify: Restart the executor

- name: Let the executor account read its virtualenv
  ansible.builtin.file:
    path: "{{ executor_venv }}"
    state: directory
    owner: root
    group: "{{ executor_group }}"
    recurse: true

- name: Write the gunicorn config
  ansible.builtin.template:
    src: gunicorn-conf.py.j2
    dest: "{{ executor_root }}/gunicorn-conf.py"
    owner: root
    group: "{{ executor_group }}"
    mode: "0640"
  notify: Restart the executor

# --- the service ----------------------------------------------------------------------------------
# Before the images, deliberately. Image builds are the slowest and most fragile thing here — they
# pull from Docker Hub and PyPI — and a failure in one of them used to abort the play before the
# unit was ever installed, leaving the host with no executor rather than one that could grade with
# the images that did build.

- name: Install the systemd unit
  ansible.builtin.template:
    src: easy-executor.service.j2
    dest: /etc/systemd/system/easy-executor.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the executor

- name: Start the executor and enable it at boot
  ansible.builtin.systemd_service:
    name: easy-executor
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers, so the check below tests what was just deployed
  ansible.builtin.meta: flush_handlers

- name: Ask the executor what it is
  ansible.builtin.uri:
    url: "http://{{ executor_bind_address }}:{{ executor_port }}/v1/version"
    return_content: true
  register: executor_version
  retries: 10
  delay: 2
  until: executor_version.status is defined and executor_version.status == 200
  # Asking is read-only, so a dry run should still ask — and has to, because the task below reads
  # this result. Skipped, it registers a dict with no `json` key and the debug fails on it, which is
  # what `--check` did against an otherwise healthy host.
  check_mode: false

- name: Say what answered
  ansible.builtin.debug:
    msg: "executor reports {{ executor_version.json }}"

# --- the grading images -----------------------------------------------------------------------

- name: Create the image build directories
  ansible.builtin.file:
    path: "{{ executor_root }}/images/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ executor_images }}"
  loop_control:
    label: "{{ item.name }}"

- name: Place each Dockerfile
  ansible.builtin.copy:
    src: "{{ executor_dockerfile_src }}/{{ item.dockerfile }}"
    dest: "{{ executor_root }}/images/{{ item.name }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: placed_dockerfiles
  loop: "{{ executor_images }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fetch the sources an image build COPYs in
  ansible.builtin.git:
    repo: "{{ item.git.repo }}"
    dest: "{{ executor_root }}/images/{{ item.name }}/{{ item.git.dest }}"
    version: HEAD
    # The build context, not a working copy anyone edits. A forced update keeps a re-run honest
    # rather than silently building last month's grader.
    force: true
  register: fetched_contexts
  loop: "{{ executor_images | selectattr('git', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# The two tasks above are the only things that decide what an image *would* contain, so a change in
# either is the signal that the image on the host is now older than its own build context.
#
# Without this the role could only ever build an image that was **missing**, which made a version
# bump undeployable in the most misleading way available: `silmused==1.7.4` -> `1.7.11` updated the
# Dockerfile, reported `changed`, restarted nothing, and left grading running on 1.7.4. The host then
# *documented* a version it was not using — and since the Dockerfile is also how anyone answers
# "what is dev grading with", the answer was wrong in the one place people look. Found on
# 2026-08-20 deploying PR #70; the fix is to let the same evidence that says the context moved also
# say the image must be built again.
#
# This makes the `force: true` on the git fetch honest as well. Its comment claims a forced update
# keeps a re-run from "silently building last month's grader" — it did not, because nothing rebuilt
# after the fetch. Now it does.
#
# What this deliberately does **not** cover: an image whose own context is untouched but whose *base*
# was rebuilt. `imgrec` builds FROM `pygrader`, so a pygrader rebuild leaves imgrec on the old base
# until something edits the imgrec Dockerfile. Expressing that needs a declared dependency between
# entries in `executor_images`, which is a bigger change than the bug being fixed here; until then,
# `docker image rm imgrec` before a run is the manual answer.
- name: Work out whose build context moved
  ansible.builtin.set_fact:
    executor_images_stale: "{{
      (placed_dockerfiles.results | default([]) | selectattr('changed') | map(attribute='item.name') | list)
      + (fetched_contexts.results | default([]) | selectattr('changed') | map(attribute='item.name') | list)
    }}"

- name: Say which images are being rebuilt because their context moved
  ansible.builtin.debug:
    msg: "Rebuilding on changed build context: {{ executor_images_stale | join(', ') }}"
  when: executor_images_stale | length > 0

- name: Ask which images already exist
  ansible.builtin.command: "docker image inspect {{ item.name }}"
  register: existing_images
  changed_when: false
  failed_when: false
  loop: "{{ executor_images }}"
  loop_control:
    label: "{{ item.name }}"

# Sequentially and in the order they are declared, because imgrec builds FROM pygrader. A first run
# takes several minutes; later runs skip everything.
#
# Errors are carried rather than fatal, and the play asserts on them at the very end. An image build
# depends on Docker Hub and PyPI, so it is the task most likely to fail for reasons having nothing
# to do with this host — and when one does, registering the images that *did* build is far more
# useful than abandoning the run. Nothing is hidden: the missing ones are named twice below.
#
# A rebuild of a *present* image cannot leave the host worse off: `docker build -t` only moves the
# tag once the build succeeds, so a failure here leaves the previous image serving grading requests
# and is reported by the two tasks at the end of this file. That is why the stale case needs no
# separate temporary tag.
- name: Build the grading images
  ansible.builtin.command:
    cmd: "docker build -t {{ item.item.name }} ."
    chdir: "{{ executor_root }}/images/{{ item.item.name }}"
  when: item.rc != 0 or item.item.name in executor_images_stale
  loop: "{{ existing_images.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: true

- name: Ask which images exist now
  ansible.builtin.command: "docker image inspect {{ item.name }}"
  register: built_images
  changed_when: false
  failed_when: false
  loop: "{{ executor_images }}"
  loop_control:
    label: "{{ item.name }}"

- name: Work out what actually built
  ansible.builtin.set_fact:
    executor_images_present: "{{ built_images.results | selectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"
    executor_images_missing: "{{ built_images.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"

# An image can answer to more than one reference: TSL exercises ask for `tiivad:tsl-compose`, which
# is the tiivad image under the tag production uses. Only tags of images that actually built.
- name: Apply the extra tags an image answers to
  ansible.builtin.command: "docker tag {{ item.0.name }} {{ item.1 }}"
  loop: "{{ executor_images | subelements('tags', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  when: item.0.name in executor_images_present
  changed_when: false  # `docker tag` is idempotent; re-tagging the same image is a no-op

- name: Say plainly which images are missing, if any
  ansible.builtin.debug:
    msg: >-
      These images did not build and will NOT be registered, so no exercise can be graded with
      them: {{ executor_images_missing | join(', ') }}
  when: executor_images_missing | length > 0

# --- the database rows core looks up ---------------------------------------------------------------
# In their own file because a database restore has to be able to put them back on its own, without
# rebuilding four Docker images to get there. See register_in_db.yml.
- name: Register this executor and its images with core
  ansible.builtin.include_tasks: register_in_db.yml

# Last, so that everything above has run and the host is in the best state it can be, and only then
# does the run go red. A build failure is a real failure — it means some exercise type cannot be
# graded here — but it should not cost the environment its executor.
- name: Fail the run if any declared image is missing
  ansible.builtin.assert:
    that: executor_images_missing | length == 0
    fail_msg: >-
      The executor is deployed and running, and every image that built is registered — but these
      did not build: {{ executor_images_missing | join(', ') }}. Exercises using them cannot be
      graded on this host. The build output is above.
    success_msg: "All {{ executor_images_present | length }} grading images built and registered."
