---
# The systemd unit that runs core, plus the directory layout the deploy script expects to find.
#
# This role does not put a jar on the host — `deploy/deploy.sh` does that, from a CI
# artifact. So a freshly converged host has a unit that is enabled and correct and has nothing to
# run yet, which is the intended intermediate state.

easy_core_service_name: easy-core

# Ubuntu 24.04 has openjdk-25 in the archive, which matters because core targets 25
# (`languageVersion = JavaLanguageVersion.of(25)` in core/build.gradle.kts). A 21 runtime would fail
# with UnsupportedClassVersionError at startup, and that error names bytecode versions rather than
# Java releases, so it is worth not having to decode it.
easy_core_jre_package: openjdk-25-jre-headless
easy_core_java: /usr/bin/java

# The layout deploy/README.md documents as a precondition.
easy_core_root: /srv/easy
easy_core_jar: "{{ easy_core_root }}/core/current.jar"

# Core's logback config writes a rolling file as well as stdout. Journald still gets everything via
# stdout, so this file is the second copy — the one with six months of history behind it.
#
# The path used to be relative and hardcoded in logback.xml, which meant the unit's WorkingDirectory
# silently decided it. core now reads `${EASY_LOG_PATH:-easy.log}` (EZ-1550) and the unit passes
# these two joined, so the config says where the log is instead of the reader having to infer it.
easy_core_log_dir: /var/log/easy
easy_core_log_file: easy.log

# Extra JVM flags. Empty by default — the JVM's own default maximum heap is a quarter of RAM, which
# is a reasonable starting point, and picking a number without measuring is how you end up with one
# that is wrong in both directions.
easy_core_java_opts: ""

# Accounts allowed to restart core without a password. Empty by default, because this is a sudo
# grant: on a host where deploys happen it wants the deploy account, and nowhere else. The grant is
# scoped to exactly one command — deploy/README.md §"Before the first deploy" asks for
# `NOPASSWD: /usr/bin/systemctl restart easy-core` and nothing wider.
easy_core_deploy_users: []

# Machine accounts that belong in the deploy group but are not deployers, and so must survive the
# revoke task that prunes it back to `easy_core_deploy_users`.
#
# Only core_autodeploy's account, and only where that role is actually installing something. The two
# halves both matter. Where autodeploy is on, the roles otherwise fight on every play — this one
# evicts the account, that one re-adds it — and a timer tick landing between them loses write access
# to the release tree mid-deploy. Where it is off, the account should lose the group: absent.yml
# leaves the account itself alone deliberately, and membership of the group that may replace the jar
# core runs is the part of it that is a privilege.
#
# core_rollout's account is the same case: it replaces autodeploy where it is enabled, and is the
# other thing on the host allowed to swap the jar.
easy_core_deploy_group_service_accounts: >-
  {{ ([core_autodeploy_user | default('easy-autodeploy')]
      if (core_autodeploy_enabled | default(false) | bool) else [])
     + ([core_rollout_user | default('easy-rollout')]
        if (core_rollout_enabled | default(false) | bool) else []) }}

# A root-owned reader for core's journal, granted NOPASSWD alongside the restart. It exists because
# the unit cannot be pinned in sudoers: journalctl takes `-u` repeatedly, and a sudoers wildcard
# matches the whole rest of the command line, so any rule permissive enough to allow a time window
# also permits a second `-u` — and the auth log with it.
#
# It is also what makes an unattended agent able to read a cron job's output the next morning, which
# the fixed `-n 40` grant cannot: forty lines is a few minutes of traffic on a busy host.
easy_core_log_helper_path: /usr/local/bin/easy-core-log

# The group that owns write access to the release tree. Separate from the service account on purpose:
# core needs to read the jar, deployers need to replace it, and those are different privileges.
easy_core_deploy_group: easy-deploy

# The unit `deploy/deploy.sh` starts to take a restore point before it restarts core, on the
# environments whose env file sets PRE_RESTART_DUMP. It comes from roles/postgres, so this is only
# a name — but it is the name that has to appear in sudoers, and the grant is an exact match.
easy_core_deploy_dump_service: easy-db-backup.service
