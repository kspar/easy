---
# Only restarts what is already running: on a host with no release deployed the unit is enabled but
# stopped on purpose, and a config change should not be what starts it for the first time.
- name: Restart core service
  ansible.builtin.systemd_service:
    name: "{{ easy_core_service_name }}"
    state: restarted
    daemon_reload: true
  when: easy_core_jar_stat.stat.exists | default(false)
