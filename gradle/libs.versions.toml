# Single source of truth for dependency and plugin versions.
#
# Plugin versions are declared once in the root build.gradle.kts (all `apply false`);
# subprojects then apply them without a version. Keep it that way — repeating a version in a
# subproject is what this file exists to prevent.
#
# One version escapes this file: core's `buildscript { classpath("org.liquibase:liquibase-core") }`.
# Version catalog accessors are not available inside a `buildscript` block, so that literal has
# to be kept in sync with `liquibase` below by hand. It is commented at the call site.

[versions]
kotlin = "2.4.10"
# Kover, not JaCoCo. JaCoCo lags new class-file versions and this build is on JDK 25 — a coverage
# tool that can block the build on a JDK upgrade is a liability in something meant to gate a deploy.
# Kover is Kotlin-native and reads the same bytecode the compiler just produced.
kover = "0.9.9"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
liquibaseGradle = "3.1.0"

awsSdk = "2.52.1"
commonmark = "0.30.0"
commonsLang3 = "3.20.0"
exposed = "1.4.0"
fuzzywuzzy = "1.4.0"
jsoup = "1.23.1"
# :tsl and :tsl-common get JUnit explicitly. :core does not need this — it inherits jupiter from
# spring-boot-starter-test, whose version the Boot BOM decides; pinning it here for those two would
# risk the two modules disagreeing on the platform version inside one build.
junit = "5.14.2"
kaml = "0.104.0"
kotlinLogging = "8.0.4"
kotlinxSerializationJson = "1.11.0"
liquibase = "4.31.1"
picocli = "4.7.7"
# Pinned rather than versionless: this project applies the Spring Boot plugin's dependency
# management, which does not import testcontainers-bom, so an unversioned coordinate fails to
# resolve. Bump alongside the postgres:16 tag in TestDatabase.kt and docker-compose.yml.
testcontainers = "1.21.4"
tika = "3.3.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibaseGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[libraries]
# --- Versionless: resolved by the Spring Boot BOM (io.spring.dependency-management) ---
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# @AutoConfigureMockMvc. Its own module in Boot 4 — spring-boot-test-autoconfigure was split up, so
# the old org.springframework.boot.test.autoconfigure.web.servlet package no longer exists and the
# annotation now lives in org.springframework.boot.webmvc.test.autoconfigure.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
# Request post-processors that put an EasyUser straight into the SecurityContext, so MockMvc tests
# exercise the same object both production auth paths produce. See core/testing/Auth.kt.
spring-security-test = { module = "org.springframework.security:spring-security-test" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
postgresql = { module = "org.postgresql:postgresql" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }

# --- Versionless: aligned by the Kotlin plugin's BOM ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }

# --- Versioned ---
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-jodatime = { module = "org.jetbrains.exposed:exposed-jodatime", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
fuzzywuzzy = { module = "me.xdrop:fuzzywuzzy", version.ref = "fuzzywuzzy" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
# Tests start their own PostgreSQL rather than expecting a hand-made one — see TestDatabase.kt.
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
# MinIO, so StorageServiceContractTest can run the same assertions against S3StorageService that it
# runs against the local one. Production stores files in S3; a suite that only ever exercised the
# local backend would be coverage of the wrong thing.
testcontainers-minio = { module = "org.testcontainers:minio", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }

[bundles]
exposed = ["exposed-core", "exposed-jdbc", "exposed-dao", "exposed-jodatime", "exposed-json"]
commonmark = ["commonmark", "commonmark-ext-gfm-tables", "commonmark-ext-gfm-strikethrough"]
