# Build-level Gradle settings.
#
# This file must live in the ROOT project — Gradle reads gradle.properties only from the root
# project directory and GRADLE_USER_HOME, never from subprojects. There used to be a
# core/gradle.properties setting warning.mode; it was silently ignored for its whole life.

# Surface deprecation warnings in full rather than the "use --warning-mode all" hint.
# Currently the only offender is the Liquibase Gradle plugin (Project.container(Class, Closure),
# removed in Gradle 10) — coming from the plugin, not from our build scripts.
org.gradle.warning.mode=all

# Reuse task outputs across builds.
org.gradle.caching=true

# Build independent modules concurrently (tsl-common -> tsl -> core is mostly serial, but
# this costs nothing and helps once there are more modules).
org.gradle.parallel=true
