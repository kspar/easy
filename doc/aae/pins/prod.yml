# What production's grading images should be built from.
#
# ## Changing this file deploys. Read that sentence again if you knew the old one.
#
# **Everything above this line used to say the opposite, and it was true when it was written.** This
# file carried a long warning that production had no inventory entry, no reconciler, and that a
# merged change here was inert — which is exactly the belief that makes somebody merge a version bump
# on a quiet afternoon without thinking too hard about it.
#
# That stopped being true on 2026-09-11 (EZ-1899). Production's executor is in the inventory, the
# reconciler runs on it every five minutes, and it follows the `:prod` channel that CI moves when this
# file changes. So a merged change here reaches the host that grades real submissions in about five
# minutes, unattended.
#
# What catches a bad version is no longer a person reading this warning. It is the pair of gates on
# the host: the image's own smoke check runs before the bare tag moves, so a broken image never
# grades a submission, and a synthetic submission is graded end to end afterwards, with the previous
# image retagged back if it scores wrong. Those are real and they have been exercised. They do not
# check that a version is the one you *meant*, only that it works.
#
# ## The values were measured, and they match
#
# These were once a belief rather than a measurement, and the file said so. They have since been
# compared against the host, and on 2026-09-11 they agreed exactly — not merely matching version
# numbers, but each live image's `easy.grading.inputs` label equalling the digest `bin/pins.py`
# computes for prod, and the registry's `prod` channel pointing at those same digests. Production is
# running what this file describes.
#
# Re-checking that is two commands and no guesswork:
#
#   python bin/pins.py digest prod <image>
#   curl -s http://<executor>/v1/version        # compare each image's `inputs`
#
# ## Who may change it
#
# `.github/pins-bumpers.yml` is no longer empty under `prod.`. silmused matches dev, because it is
# the same judgement about the same students; tiivad deliberately does not, because it is what most
# of the platform grades through. That file carries the reasoning.
#
# ## Why a separate file at all
#
# Because the unit of permission is the file. Somebody trusted to move silmused on dev is not thereby
# trusted to move it on production, and no pull request should be able to do both at once. Building
# that in early cost one file; retrofitting it would have meant redoing the guard, the allowlist and
# the channel naming.
#
# ## A note on an earlier warning, now withdrawn
#
# This file used to carry a block saying the values had been measured and several were wrong, one of
# them naming an image that did not exist under that name. That was written before production was
# onboarded, and it no longer describes the host: on 2026-09-11 every value here was compared against
# it by digest and all four agreed. It is recorded rather than deleted because "the pins are wrong"
# is a frightening thing to half-remember, and somebody who read the old block deserves to find out
# here that it was resolved rather than quietly removed.
#
# Specific findings about a live host still do not belong in a public repository. Anything measured
# stays in the local-only production runbook; ask kspar.

schema: "1"
environment: "prod"

rebuild.SERIAL: "1"

tiivad.TIIVAD_VERSION: "0.0.33"
tiivad.NUMPY_SPEC: "1.23.4"

silmused.SILMUSED_VERSION: "1.7.11"
silmused.PSYCOPG2_VERSION: "2.9.9"

# The commit that merged python-grader's `easy` branch into `master`. From 2026-08-20 to 2026-08-30
# this named a master commit from before that merge, which has no `grader/easy.py` and so cannot
# grade anything — production was untouched only because its images predate CI and nothing has
# rebuilt them. See dev.yml for the whole story.
pygrader.PYTHON_GRADER_REF: "2ab5427c791eed6bc123a417520a57a17caff4a3"
pygrader.NUMPY_SPEC: "1.23.4"

imgrec.PILLOW_VERSION: "12.3.0"
imgrec.REQUESTS_VERSION: "2.34.2"
