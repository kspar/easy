# Who may bump which grading library, in which environment, without a core dev reviewing it.
#
# A login here grants **no repository access whatsoever**. It is not a collaborator list and GitHub
# does not read this file. It tells .github/workflows/pins-automerge.yml whose pull request against
# which pins file it may merge on its own, and nothing else.
#
# `<environment>.<image>: "login login"`, space separated. Same grammar as the pins files, parsed by
# the same code in bin/pins.py, so there is one format to learn and one parser to trust.
#
# ## Empty means "a core dev has to merge it"
#
# An empty value is the safe state and the default. Fail-closed is deliberate throughout: a typo in
# an image name here does not open a hole, it just means nobody is listed for the real image and that
# image's bumps need review.
#
# ## Why this file has to exist
#
# kspar/easy is public, so anyone on the internet can open a pull request against it. Without an
# allowlist, auto-merge would let a stranger move dev's grading library to any published version of
# silmused — and a green CI run does not make that not-vandalism, because CI's job is to check the
# version works, not to check somebody wanted it.
#
# The GitHub-native alternative is to add bumpers as `triage` collaborators (which grants no push
# access) and gate on author_association == COLLABORATOR. That was rejected because it cannot say
# "may bump silmused but not pygrader" or "may bump dev but not production", which is the whole
# requirement.
#
# ## This file is always read from master
#
# pins-automerge.yml checks out master explicitly. A pull request cannot add itself here, because the
# copy of this file in the pull request is never the one consulted.

# Every key here is an `<environment>.<image>` pair. There is deliberately no schema or environment
# header: this file is not a pins file, it only borrows the grammar.

# --- dev ---------------------------------------------------------------------------------------

dev.silmused: "nuubis"
dev.tiivad: "emuuli KarmoSaviauk"

# Deliberately nobody. pygrader is pinned to a commit in an unreviewed upstream tree rather than to a
# released package, so moving it is a judgement rather than a version bump.
dev.pygrader: ""

# Deliberately nobody. Nothing in imgrec has ever been bumped; its pins were captured from a build,
# not chosen, and a change to them wants somebody to say why.
dev.imgrec: ""

# --- production --------------------------------------------------------------------------------
#
# These were all empty, and the reason was written here: production had no reconciler, so a merged
# prod bump deployed nothing, and filling these in would have let somebody merge one and reasonably
# believe production had been updated. That stopped being true on 2026-09-11 (EZ-1899), when the
# reconciler was enabled on the production executor and verified against a real change. A merged
# prod pin now reaches that host within about five minutes.
#
# silmused mirrors dev: it is the same judgement — is this version fit to grade with — made by the
# same person, and splitting it would mean a maintainer trusted to decide that for students on dev is
# not trusted to decide it for the same students on production.
#
# **tiivad deliberately does not mirror dev, and this asymmetry is the point rather than an
# oversight.** Its bumps stay with a core dev on production. It is the widest thing here by a long
# way: on 2026-09-11 production had 722 current exercise versions grading through `tiivad:tsl-compose`
# against 84 on silmused, so a tiivad version that grades wrongly is most of the platform rather than
# one course's worth. Both its maintainers keep dev, where that judgement is made and where a bad
# version is found.
#
# What stands between a bump and production is not this file. It is the same two gates dev has, and
# they are stronger than an allowlist: the image's own smoke check runs before the bare tag moves, so
# a broken image never grades a submission, and a synthetic submission is graded end to end
# afterwards, with the previous image retagged back if it scores wrong. A bad version is refused by
# the machine, not by the list of who may ask. The list decides who may ask without waiting.
#
# pygrader and imgrec stay empty here for the same reasons they are empty for dev, not for any
# production-specific one: pygrader is pinned to a commit in an unreviewed upstream tree rather than
# a release, and nothing in imgrec has ever been bumped.

prod.silmused: "nuubis"
prod.tiivad: ""
prod.pygrader: ""
prod.imgrec: ""
