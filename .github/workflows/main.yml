name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      # What the dev host tracks. Pushing here is the deploy: a timer on that box asks whether a
      # green run exists for the commit this branch points at and installs it. See
      # ansible/roles/core_autodeploy and deploy/README.md.
      #
      # Deliberately not called `releases`: `releases/*` below is for real version branches, and a
      # name that says which environment it feeds cannot be confused with one of those.
      #
      # KEEP THIS LINE. It looks like waste and mostly is: the normal flow is
      # `git push origin master:dev-releases`, where master has already built this exact tree, so
      # this run duplicates one that passed minutes ago — and because the deployer matches on the
      # commit rather than the branch, it does not even shorten the wait.
      #
      # What it buys is the abnormal flow. A commit pushed straight at this branch — a quick fix,
      # made at exactly the moment nobody is being careful — is otherwise never built at all, and
      # the deploy silently never comes. Reviewed and kept on 2026-08-09 for that reason; deleting
      # it to save CI minutes is removing the only gate on the one path that has none.
      - dev-releases
      - 'releases/*'

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # One command, and every test runs — which is new. This used to be `build -x test` followed
      # by `:core:test -PexcludeTags=db`, because the database-backed tests needed a PostgreSQL
      # instance and a gitignored config file that CI had neither of (EZ-1715). Both are gone: the
      # suite starts its own postgres via Testcontainers, and the test config is committed.
      #
      # It needs a Docker daemon. ubuntu-latest has one. Two containers now: PostgreSQL, and a MinIO
      # for the S3 half of StorageServiceContractTest — production stores uploaded files in S3 and
      # CI would otherwise only ever exercise the local filesystem backend. The MinIO half skips
      # with a reason when there is no Docker at all, and *fails* if Docker is there and the
      # container will not start — a silent drop to one backend is the failure that test exists to
      # prevent.
      #
      # DO NOT add `container:` to this job. The database would then be reachable as a service
      # alias rather than on localhost, and assertDisposableDatabase in
      # core/src/test/kotlin/core/testing/DatabaseReset.kt refuses non-localhost hosts on purpose —
      # it is what stops a misconfigured run emptying something real. Widen LOCAL_HOSTS there
      # deliberately if that day comes, rather than routing around it here.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # Uploaded on success too: when a deploy is blocked at 2am, "which assertion" has to be
      # answerable without re-running the build.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report-${{ github.sha }}
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      # Dev fetches this instead of building on the host — deploy/deploy-dev.sh,
      # doc/dev-environment.md §8. The jar is environment-agnostic: every setting lives in the
      # external application.yaml, so the artifact dev exercises is byte-for-byte the one that
      # can later go to production.
      #
      # Steps are sequential, so a failing build or test above publishes nothing. The web job is
      # independent though, and a green backend with a red web job still leaves a jar behind —
      # which is why the deploy script gates on the *run's* conclusion rather than on an artifact
      # merely existing.
      - name: Package core jar
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        run: |
          # Found by pattern rather than named core-1.jar, so that `version` in
          # core/build.gradle.kts stays something CI has no opinion about. The exclusion matters:
          # the Boot plugin also emits a `-plain` jar holding classes without dependencies, which
          # looks identical here and dies with "no main manifest attribute" on the server.
          shopt -s nullglob
          boot=()
          for jar in core/build/libs/*.jar; do
            [[ "$jar" == *-plain.jar ]] || boot+=("$jar")
          done
          if [[ ${#boot[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Boot jar in core/build/libs, found: ${boot[*]:-none}"
            exit 1
          fi
          cp "${boot[0]}" "core-${{ github.sha }}.jar"

      - name: Publish core jar
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ github.sha }}
          path: core-${{ github.sha }}.jar
          if-no-files-found: error
          retention-days: 90
          # A jar is already a zip. Recompressing it buys nothing and costs upload time.
          compression-level: 0

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Fails on errors only. There is a known backlog of react-hooks findings kept at warning
      # level so it doesn't block the gate — see the comments in eslint.config.js and EZ-1722.
      - name: Lint
        run: npm run lint
      # Runs `tsc -b && vite build`. Nothing typechecked web/ before this job existed,
      # which is how 18 type errors accumulated unnoticed — `npm run dev` skips tsc.
      - name: Typecheck and build
        run: npm run build

      # Pure functions, no browser — vitest resolves the TypeScript sources directly. Runs before
      # the browser suite because it needs neither Chromium nor the stub server, so when the
      # markdown commands break this is the job that says so in seconds. It also holds the suite's
      # own bookkeeping checks (tests/unit/suite-integrity.test.mjs): an expired quarantine entry
      # or an unratcheted spec fails here, in seconds, rather than after a five-minute browser run.
      - name: Unit tests
        run: npm run test:unit

      # Browser tests: real Chromium, real router and components, backend faked by Playwright
      # route interception. See doc/web/browser-testing.md. Playwright starts and stops the stub
      # dev server itself (webServer in playwright.config.ts).
      #
      # Playwright's own chromium rather than the runner image's Chrome, so the browser version is
      # pinned by the @playwright/test dependency and can't drift underneath us — which is what
      # HARNESS_BROWSER_CHANNEL='' below selects.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          HARNESS_BROWSER_CHANNEL: ''
        run: npm run test:browser
      # On failure: the HTML report, the traces, and the screenshots each spec takes as it goes.
      # A trace is the difference between "we know it broke" and "we know why" once the runner is
      # gone, and PW_TRACE defaults to on under CI for exactly that reason.
      - name: Publish browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
            web/tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # The dist has been environment-agnostic since EZ-1726 — config.json is read at boot rather
      # than baked in — so one tarball serves dev and production both. See §8.1.
      - name: Package web dist
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        run: |
          # config.json is deliberately NOT shipped. web/public/config.json holds the *production*
          # IdP and API as local-dev defaults, so an artifact carrying it is one forgotten deploy
          # step away from dev quietly talking to production — the failure §4.1 is written
          # around, and not one anybody debugs quickly. Without the file the app renders a
          # "Configuration error" page naming the problem, and deploy-dev.sh writes the real
          # one from deploy/<env>/config.json.
          rm -f dist/config.json
          tar -czf "../web-${{ github.sha }}.tar.gz" -C dist .

      - name: Publish web dist
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.sha }}
          # Workspace-relative: `defaults.run.working-directory` applies to `run` steps, not to
          # action inputs, so this is the repo root rather than web/.
          path: web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90
          # Already gzipped.
          compression-level: 0

  executor:
    name: Executor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aae
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # aae's flask 3.1 needs >= 3.9 and the deploy hosts are on 3.12. Pinned rather than
          # floating so a new Python release does not first appear here on an unrelated push.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aae/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      # Nothing imported server.py in CI before this job existed, so a syntax error or a bad import
      # in the executor reached a deploy. The suite fakes Docker throughout — it tests the directory
      # aae lays out and the answers it gives, not Docker — so this job needs no daemon and takes
      # seconds. Running a generated script against a real tiivad is EZ-1775.
      - name: Test
        run: python -m pytest tests -q

  # Without this, GitHub knows nothing about the JVM dependencies: the dependency graph held
  # only npm packages, so no Dependabot alert could ever fire for core, tsl or their transitive
  # dependencies. `.github/dependabot.yml` gets us version-update PRs for Gradle, but security
  # alerts need the graph to be populated, and Gradle is not parsed automatically the way
  # package-lock.json is. This submits a resolved snapshot instead.
  dependency-graph:
    name: Submit dependency graph (Gradle)
    # Default branch only. The snapshot describes what master depends on, and a PR build would
    # otherwise overwrite that with the PR's view.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # Required to write the snapshot through the Dependency Submission API.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@v6
