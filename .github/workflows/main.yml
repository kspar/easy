name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Tests are excluded: they need a PostgreSQL instance plus core/src/test/resources/
      # application.yaml, which is gitignored (see DEVELOPMENT.md). Wiring a postgres
      # service container and generating that config would let this become a plain
      # `./gradlew build` — worth doing, but it is its own change. See EZ-1715.
      - name: Build
        run: ./gradlew build -x test --no-daemon
      # The suite as a whole is excluded above, but the security tests hold no Spring context,
      # so they need neither PostgreSQL nor the gitignored config file and can run here today.
      # Verified by running them with core/src/test/resources/application.yaml moved aside.
      # The package filter is the weak point — a new context-free test elsewhere won't be picked
      # up. Once EZ-1715 gives the suite a database this whole step folds into `./gradlew build`.
      - name: Security tests
        run: ./gradlew :core:test --tests 'core.conf.security.*' --no-daemon

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Fails on errors only. There is a known backlog of react-hooks findings kept at warning
      # level so it doesn't block the gate — see the comments in eslint.config.js and EZ-1722.
      - name: Lint
        run: npm run lint
      # Runs `tsc -b && vite build`. Nothing typechecked web/ before this job existed,
      # which is how 18 type errors accumulated unnoticed — `npm run dev` skips tsc.
      - name: Typecheck and build
        run: npm run build
