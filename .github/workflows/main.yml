name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      # What the dev host tracks. Pushing here is the deploy: a timer on that box polls for the
      # newest green run on this branch and installs it. See ansible/roles/core_autodeploy and
      # deploy/README.md.
      #
      # Deliberately not called `releases`: `releases/*` below is for real version branches, and a
      # name that says which environment it feeds cannot be confused with one of those.
      - dev-releases
      - 'releases/*'

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Tests are excluded: they need a PostgreSQL instance plus core/src/test/resources/
      # application.yaml, which is gitignored (see DEVELOPMENT.md). Wiring a postgres
      # service container and generating that config would let this become a plain
      # `./gradlew build` — worth doing, but it is its own change. See EZ-1715.
      - name: Build
        run: ./gradlew build -x test --no-daemon
      # Everything except the tests tagged `db`, which are the ones needing a PostgreSQL instance
      # and the gitignored core/src/test/resources/application.yaml. Verified by running with that
      # file moved aside. This replaced a hardcoded `core.conf.security.*` package filter, which
      # silently skipped any context-free test written anywhere else — as the first one to be
      # added promptly was. Folds into `./gradlew build` once EZ-1715 gives the suite a database.
      - name: Unit tests
        run: ./gradlew :core:test -PexcludeTags=db --no-daemon

      # Staging fetches this instead of building on the host — deploy/deploy-staging.sh,
      # doc/staging-environment.md §8. The jar is environment-agnostic: every setting lives in the
      # external application.yaml, so the artifact staging exercises is byte-for-byte the one that
      # can later go to production.
      #
      # Steps are sequential, so a failing build or test above publishes nothing. The web job is
      # independent though, and a green backend with a red web job still leaves a jar behind —
      # which is why the deploy script gates on the *run's* conclusion rather than on an artifact
      # merely existing.
      - name: Package core jar
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        run: |
          # Found by pattern rather than named core-1.jar, so that `version` in
          # core/build.gradle.kts stays something CI has no opinion about. The exclusion matters:
          # the Boot plugin also emits a `-plain` jar holding classes without dependencies, which
          # looks identical here and dies with "no main manifest attribute" on the server.
          shopt -s nullglob
          boot=()
          for jar in core/build/libs/*.jar; do
            [[ "$jar" == *-plain.jar ]] || boot+=("$jar")
          done
          if [[ ${#boot[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Boot jar in core/build/libs, found: ${boot[*]:-none}"
            exit 1
          fi
          cp "${boot[0]}" "core-${{ github.sha }}.jar"

      - name: Publish core jar
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ github.sha }}
          path: core-${{ github.sha }}.jar
          if-no-files-found: error
          retention-days: 90
          # A jar is already a zip. Recompressing it buys nothing and costs upload time.
          compression-level: 0

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/dev-harness/package-lock.json
      - name: Install
        run: npm ci
      # Fails on errors only. There is a known backlog of react-hooks findings kept at warning
      # level so it doesn't block the gate — see the comments in eslint.config.js and EZ-1722.
      - name: Lint
        run: npm run lint
      # Runs `tsc -b && vite build`. Nothing typechecked web/ before this job existed,
      # which is how 18 type errors accumulated unnoticed — `npm run dev` skips tsc.
      - name: Typecheck and build
        run: npm run build

      # Pure functions, no browser, no framework — Node imports the TypeScript directly. Runs
      # before the browser suite because it needs neither Chromium nor the stub server, so when
      # the markdown commands break this is the job that says so in seconds.
      - name: Unit tests
        run: npm run test:unit

      # Browser tests: real Chromium, real router and components, backend faked by Playwright
      # route interception. See doc/web/browser-testing.md. Only the backend-free scripts run
      # here — run-suite.mjs holds the list, and starts/stops the stub dev server itself.
      # `cd` rather than a step-level working-directory: this job already sets
      # defaults.run.working-directory, and stacking an override on it is a path ambiguity that
      # would only surface as a red build.
      - name: Install browser harness
        run: cd dev-harness && npm ci
      # Playwright's own chromium rather than the runner image's Chrome, so the browser version
      # is pinned by the playwright dependency and can't drift underneath us.
      - name: Install Chromium
        run: cd dev-harness && npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          HARNESS_BROWSER_CHANNEL: ''
        run: npm run test:browser
      # The screenshots are the only way to tell a layout regression from a timing flake once
      # the runner is gone.
      - name: Publish failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots-${{ github.sha }}
          path: web/dev-harness/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # The dist has been environment-agnostic since EZ-1726 — config.json is read at boot rather
      # than baked in — so one tarball serves staging and production both. See §8.1.
      - name: Package web dist
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        run: |
          # config.json is deliberately NOT shipped. web/public/config.json holds the *production*
          # IdP and API as local-dev defaults, so an artifact carrying it is one forgotten deploy
          # step away from staging quietly talking to production — the failure §4.1 is written
          # around, and not one anybody debugs quickly. Without the file the app renders a
          # "Configuration error" page naming the problem, and deploy-staging.sh writes the real
          # one from deploy/<env>/config.json.
          rm -f dist/config.json
          tar -czf "../web-${{ github.sha }}.tar.gz" -C dist .

      - name: Publish web dist
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev-releases' || startsWith(github.ref, 'refs/heads/releases/') }}
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.sha }}
          # Workspace-relative: `defaults.run.working-directory` applies to `run` steps, not to
          # action inputs, so this is the repo root rather than web/.
          path: web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 90
          # Already gzipped.
          compression-level: 0

  # Without this, GitHub knows nothing about the JVM dependencies: the dependency graph held
  # only npm packages, so no Dependabot alert could ever fire for core, tsl or their transitive
  # dependencies. `.github/dependabot.yml` gets us version-update PRs for Gradle, but security
  # alerts need the graph to be populated, and Gradle is not parsed automatically the way
  # package-lock.json is. This submits a resolved snapshot instead.
  dependency-graph:
    name: Submit dependency graph (Gradle)
    # Default branch only. The snapshot describes what master depends on, and a PR build would
    # otherwise overwrite that with the PR's view.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # Required to write the snapshot through the Dependency Submission API.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@v6
