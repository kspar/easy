name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Tests are excluded: they need a PostgreSQL instance plus core/src/test/resources/
      # application.yaml, which is gitignored (see DEVELOPMENT.md). Wiring a postgres
      # service container and generating that config would let this become a plain
      # `./gradlew build` — worth doing, but it is its own change. See EZ-1715.
      - name: Build
        run: ./gradlew build -x test --no-daemon
      # The suite as a whole is excluded above, but the security tests hold no Spring context,
      # so they need neither PostgreSQL nor the gitignored config file and can run here today.
      # Verified by running them with core/src/test/resources/application.yaml moved aside.
      # The package filter is the weak point — a new context-free test elsewhere won't be picked
      # up. Once EZ-1715 gives the suite a database this whole step folds into `./gradlew build`.
      - name: Security tests
        run: ./gradlew :core:test --tests 'core.conf.security.*' --no-daemon

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Fails on errors only. There is a known backlog of react-hooks findings kept at warning
      # level so it doesn't block the gate — see the comments in eslint.config.js and EZ-1722.
      - name: Lint
        run: npm run lint
      # Runs `tsc -b && vite build`. Nothing typechecked web/ before this job existed,
      # which is how 18 type errors accumulated unnoticed — `npm run dev` skips tsc.
      - name: Typecheck and build
        run: npm run build

  # Without this, GitHub knows nothing about the JVM dependencies: the dependency graph held
  # only npm packages, so no Dependabot alert could ever fire for core, tsl or their transitive
  # dependencies. `.github/dependabot.yml` gets us version-update PRs for Gradle, but security
  # alerts need the graph to be populated, and Gradle is not parsed automatically the way
  # package-lock.json is. This submits a resolved snapshot instead.
  dependency-graph:
    name: Submit dependency graph (Gradle)
    # Default branch only. The snapshot describes what master depends on, and a PR build would
    # otherwise overwrite that with the PR's view.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # Required to write the snapshot through the Dependency Submission API.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@v6
