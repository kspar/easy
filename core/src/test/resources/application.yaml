# Configuration for `./gradlew :core:test`. Committed on purpose, and that is a change from how
# this used to work — it was gitignored and hand-written per machine, which is why the tests that
# need a database had never run in CI and barely ran on a laptop either (EZ-1715).
#
# Nothing here is a secret. Every value is either a fake, a loopback address that is never
# contacted, or a cron pinned to February 31st — a date that never occurs — so no scheduled job
# fires mid-test. The main config's own destructive crons use the same trick.
#
# The datasource below is a fallback that should never be used: DatabaseTestConf overrides all
# three properties at runtime from Testcontainers (or from EASY_TEST_JDBC_URL). It is present so
# the context is well-formed if that ever stops firing, and it names a database
# assertDisposableDatabase accepts, so the failure is loud rather than lossy.
#
# This file is also the authoritative list of required keys: every ${easy.*} placeholder in
# core/src/main/kotlin must appear here or the context fails to start with "Could not resolve
# placeholder ...". That assertion now runs on every push, which is the point of committing it —
# the old sample file was documentation that nothing verified.
#
# For a local override, add core/src/test/resources/application-local.yaml and run with
# `-Dspring.profiles.active=local`; that file stays gitignored.

server:
  # Tests use @SpringBootTest's default MOCK web environment, so this port is never bound.
  # Avoid 8080 anyway — a dev core usually holds it.
  port: 8098

logging:
  # Kept here rather than in a @TestPropertySource on a test class: any test-local property source
  # forks the Spring context, and each fork costs ten seconds. See core/testing/IntegrationTest.kt.
  level:
    root: WARN

spring:
  datasource:
    jdbc-url: "jdbc:postgresql://localhost:5432/easyems_test"
    username: "easyems"
    password: ""
  mail:
    # Mail is disabled below; this only needs to satisfy the JavaMailSender bean.
    host: "localhost"
    properties:
      mail:
        transport:
          protocol: "smtp"
        smtp:
          auth: false
          port: 587
          starttls:
            enable: false
            required: false
    username: "test"
    password: ""
  jackson:
    deserialization:
      FAIL_ON_NULL_FOR_PRIMITIVES: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # easy.core.auth-enabled is true below, so SecurityConf builds a resource server and
          # Boot needs these to create a JwtDecoder. The URL is never contacted: jwk-set-uri
          # fetches lazily on the first token, and tests supply an EasyUser directly rather than
          # a bearer token (core/testing/Auth.kt). JwtResourceServerTest is the exception and
          # overrides these against a JWKS server it starts itself.
          #
          # Keeping auth *enabled* here is deliberate: it wires the test context the way a
          # deployed environment is wired. The alternative — auth-enabled: false plus the
          # oidc_claim_* headers — would make the release gate the biggest consumer of the one
          # code path that must never run anywhere real.
          jwk-set-uri: "http://localhost:1/realms/test/protocol/openid-connect/certs"
          issuer-uri: "http://localhost:1/realms/test"


easy:
  core:
    liquibase:
      # Classpath-relative (ClassLoaderResourceAccessor), not a filesystem path.
      changelog: "db/changelog.xml"
    auth-enabled: true

    cors:
      # Empty is fine for tests: nothing here makes cross-origin requests.
      allowed-origins: ""
    mail:
      from: "test@easy.example"
      sys:
        enabled: false
        to: "test@easy.example"
      user:
        enabled: false

    auto-assess:
      # 100ms, not the 3000 a deployed environment uses. This is how often AutoGradeScheduler.grade()
      # starts queued jobs, so it is the floor on how long every autograde test waits — at 3000 the
      # eight in AutoGradeIntegrationTest were most of the suite's wall clock.
      #
      # Not a behaviour change in disguise: the scheduler does the same work either way, and the
      # tests poll the database for an outcome rather than sleeping for a fixed period, so a slower
      # tick would make them slow rather than make them pass. Nothing here depends on the interval.
      fixed-delay:
        ms: "100"
      fixed-delay-observer-clear:
        ms: "100"
      anonymous-submissions-to-keep: "50"
    statistics:
      fixed-delay:
        ms: "1000"

    # Loopback port 1, so a job that somehow does fire fails to connect rather than reaching
    # anything. The crons are pinned to the never-date as well.
    moodle-sync:
      wstoken: "test-token"
      moodlewsrestformat: "json"
      users:
        url: "http://localhost:1/moodle-users"
        cron: "0 0 5 31 2 ?"
        wsfunction: "local_ut_custom_get_course_groups_users"
      grades:
        url: "http://localhost:1/moodle-grades"
        wsfunction: "local_ut_custom_update_manual_grades"
      # Moodle course shortnames this environment may contact, comma-separated. EMPTY MEANS
      # UNRESTRICTED, which is what production wants — it syncs whatever teachers have linked.
      #
      # Set it on any environment that must reach a real Moodle without being trusted with all of
      # it. Enforced immediately before the request is built, which matters because grades do not
      # reach Moodle through an endpoint at all: ordinary grading pushes them, so a check on the
      # sync endpoints would cover almost nothing.
      course-allowlist: ""

    # The local backend, into a temp directory, so a test context needs no AWS anything. The sweep
    # is pinned to the never-date like everything else here, and would report rather than delete
    # even if it did fire.
    storage:
      backend: "local"
      local:
        # Overridden per JVM by TestStorageDir, for the same reason the datasource is: a directory
        # shared with the last run makes yesterday's leftovers today's orphaned objects, and the
        # sweep tests would then pass or fail on the machine's history. This value is the fallback
        # that keeps the context well-formed if that ever stops firing.
        dir: "/tmp/easy-files-test"
      s3:
        bucket: ""
        region: "eu-north-1"
        endpoint: ""
        public-base-url: ""

    upload:
      max-bytes:
        teacher: 20971520
        admin: 1073741824

    stored-file-sweep:
      cron: "0 0 5 31 2 ?"
      grace-hours: 24
      delete: false

    pending-access:
      clean:
        cron: "0 0 5 31 2 ?"

    exercise-index-normalisation:
      cron: "0 0 5 31 2 ?"

    activity:
      merge-window:
        s: "30"

    keycloak:
      cron: "0 0 5 31 2 ?"
      base-url: "http://localhost:1/idp"
      realm: "master"
      client-id: "test-client"
      client-secret: "test-secret"
      ignore-missing-keycloak-users: true

  web:
    base-url: "https://easy.example"
